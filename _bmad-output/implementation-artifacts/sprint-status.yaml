  17-1-share-a-credential-with-an-organization-member: done # review -> done 2026-07-29 via bmad-code-review. Adversarial review (Blind Hunter + Edge Case Hunter + Acceptance Auditor) found and fixed 4 patch findings, all confirmed against actual code before fixing: (1) revoke authorization-after-mutation — any project member could revoke another user's active share and only receive a 403 in response while the DB write still committed (route ran inside a transaction that commits on any non-throwing return); fixed by checking auth before calling revokeShare(). (2) reveal burned the single-use claim / inflated view_count before checking the shared field still existed, silently consuming the token with zero CREDENTIAL_SHARE_VIEWED audit entry on a field-removed-since-creation reveal; fixed by reordering the field-existence check (via revealCurrentValue) before the atomic claim. (3) AC-17's Referrer-Policy was only set on the API JSON responses, not on the /shares/[token] page's own document response (the URL that actually carries the raw token in the browser); fixed via setHeaders in +page.server.ts. (4) share metadata GET never lazily expired the share (unlike the reveal-step), so the consent page could show an expired share as active; fixed by applying the same lazy active->expired transition. Also resolved a decision-needed finding as a patch: admins had no listing endpoint to discover another user's share to exercise AC-5's admin-revoke right — listSharesForCredential now returns every share on the credential for admin/owner callers. 5 new regression tests added (21 total, up from 16) plus 1 new web test; all pass. Merged to main via PR #251. Prior: in-progress -> review 2026-07-28 via bmad-dev-story. All 9 tasks/34 subtasks complete, all 19 ACs implemented across packages/db (credential_shares table, migration 0059 — added via hand-written SQL + journal entry after drizzle-kit generate hit a pre-existing, unrelated snapshot-chain collision in this worktree), apps/