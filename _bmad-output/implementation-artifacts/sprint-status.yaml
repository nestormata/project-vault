  17-3-share-history-expiry-enforcement-and-rotation-recommended-nudge: done # review -> done 2026-07-29 via pick-story Path C. Code review (Blind Hunter + Edge Case Hunter + Acceptance Auditor) found and fixed 2 HIGH findings: (1) GET .../nudge cross-user information disclosure — the route had no per-viewer scoping (unlike the sibling shares-list route) and returned mostRecentSharedWith (a recipient email) to any project member; fixed by redacting that field unless the viewer is admin/owner or the bucket's own sharer. (2) fieldKey normalization mismatch on POST .../nudge/dismiss — dismissals were stored with only .trim() applied while shares are bucketed via normalizeFieldKey (NFC + lowercase), so a differently-cased fieldKey silently inserted into an empty bucket and the nudge never cleared; fixed by normalizing before storage. Both fixes verified via focused test suites, all green; commits ff55dc6/8007a40. Deferred medium/low findings (pagination tiebreaker, stale-share display in nudge bucket, lazy-vs-sweep race self-correcting, stale-page-bookmark UI gap, hardcoded page-size constant, no double-submit guard on dismiss) recorded in the story file's Review Findings section, not blocking. Manually verified end-to-end in a live Chrome session: external share creation (step-up re-auth), status filter across all 5 statuses, Field column, reason-required nudge dismissal (confirmed persisted server-side across a page reload, not just local state), and rotation-promote correctly transitioning an outstanding share to SUPERSEDED with an audit entry. Local `make ci` was started (all visible output green through the point it was stopped, no failures surfaced) but killed early per explicit user instruction to prioritize pushing the PR over waiting out the full local run; remote CI on the PR is the authoritative gate. Prior: in-progress -> review 2026-07-29 via bmad-dev-story (TDD red-green throughout). All 16 ACs / 7 tasks complete. Share History: listSharesForCredential/cou