ssing a client-chosen locale into `registerUser`, which directly reverses Story 15.2 AC-2's deliberate "never from client input" guard — resolved via a client-side-render + authenticated-post-registration-update split that keeps 15.2's guard intact), 18-1 (the two hardcoded `/settings/security` hrefs are actually a `href` prop into `<SettingsGateNotice>`, not literal anchor tags), 18-5 (no existing "batch active-rotation-status" helper exists despite the original draft suggesting one might). (2) A pre-mortem pass ("this shipped and failed badly — what happened?") added sequencing guards (18-3 must land after 18-7 on the same file region), tenant/RLS specificity (18-5, 18-12), rate-limit key precision (18-6), and explicit escalation points for investigate-then-fix stories (18-7, 18-8, 18-9, 18-12) rather than leaving security-adjacent judgment calls implicit. (3) An Occam's-razor simplification pass trimmed process ceremony the pre-mortem pass had over-added (redundant ACs, disproportionate sign-off gates on low-risk papercuts, gold-plated test-infra requirements) while explicitly preserving every tenant/security-relevant guard. (4) A completeness-critic pass confirmed all 18 raw feedback bullets (19 distinct asks, since one bullet bundled two) map to a concrete AC somewhere in the 12 stories with no gaps, and added one explicit scope-narrowing acknowledgment to 18-3 (the raw "most/all fields/sections" ask is deliberately bounded to a named floor list, not silently narrowed).
