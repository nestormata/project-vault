s are migrated to promoted (not staged) with promoted_at backfilled from initiated_at, preserving the already-live new value's visibility with zero observable change for dependent systems already using it (a naive in_progress -> staged mapping would have silently reverted GET .../value to the old pre-rotation value for every in-flight rotation, breaking every dependent system already switched over) — the old completeRotation()/complete route is kept but only reachable for genuinely still-in_progress rows going forward, migrated rows finish via the new retire endpoint instead. FR105 exemption (AC-3) extended so rotationLockedAt now clears only at explicit retire, not at promote, directly fixing the proposal's own highest-severity Round-3 finding (promoted-but-unretired versions were not exempt and could be silently pruned) — required regression test asserts a promoted-unretired version survives the pruning job at retentionCount=1. New stale-staged alert (AC-4) is a wholly separate worker/env-var/audit-event/column from the existing 1h stale_recovery job (STALE_ROTATION_THRESHOLD_MINUTES tops out at 7 days, independently confirming a new var was required regardless of the elicitation finding) with an explicit 3-part collision-avoidance test proving the two mechanisms can never double-fire on the same rotation. Concurrency (AC-5): promote/retire reuse the existing rotation-scoped advisory lock + CAS-on-every-terminal-transition pattern (Story 5.5 AC-10 precedent); double-promote/double-retire and retire-vs-pruning-job races all get required integration tests, not just documented behavior. Break-glass (AC-9) resolves a real tension between the proposal's literal "instantly promotes+retires" text and the existing deliberate 1h break-glass overlap rollback-safety window by keeping physical purge timing unchanged and only making the state-machine bookkeeping (ROTATION_PROMOTED fires immediately, ROTATION_OLD_RETIRED deferred to when the existing overlap-expiry worker actually purges) instant — flagged explicitly as a judgment call for Nestor to confirm, not a certainty. Surface scope: both (Epic 5 already has a shipped web UI via 5-4; an API-only version of this story would visibly regress it) — Task 6 covers the Active/Staged/Retire card UI rework. Two other explicit open questions left for Nestor: no staleness nag exists for indefinitely promoted-but-unretired rotations (only the pre-promotion staged window gets one, matching what the elicitation rounds actually asked for); and credentials.currentVersionId's pre-existing dormancy (confirmed unused by the rotation path both before and after this story) is deliberately left untouched to avoid scope creep. Numbered 5-6 (not 5-4) since 5-4/5-5 slugs are already taken. Blocks Story 13-4's AC rewrite and Story 2-10. Prior: added 2026-07-24 via bmad-correct-course (sprint-change-proposal-2026-07-24.md, item 2 + 4-round advanced elicitation, see proposal §7).
