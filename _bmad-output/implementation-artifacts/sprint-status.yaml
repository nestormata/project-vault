  9-4-platform-operator-audit-log: done # fixed 2026-07-11 (branch fix/9-4-maintenance-drain-partial-loss, on top of already-merged PR #122): resolved the code-review-flagged partial-drain data-loss decision — `deactivateMaintenanceMode` (apps/api/src/modules/platform-audit/maintenance-mode.ts) previously ran the whole operator-initiated drain inside one outer transaction and threw `MaintenanceModeStillUnavailableError` from inside it whenever any entry remained undrained, rolling back every SAVEPOINT already released for entries that DID drain successfully. Restructured to take the `Db` handle instead of a caller-supplied `Tx`, run `drainPendingEntries` in its own top-level `db.transaction(...)` that commits unconditionally once the per-entry-SAVEPOINT loop finishes, then decide whether to throw `MaintenanceModeStillUnavailableError` afterward, outside any transaction, so the throw can no longer undo the drain's already-committed work; `routes.ts`'s deactivate handler updated to call `deactivateMaintenanceMode(getDb(), auth.userId)` directly. New TDD test (`deactivateMaintenanceMode preserves a partial drain when the queue has a poisoned entry`) seeds 2 drainable + 1 genuinely-poisoned (forbidden-audit-key payload) pending entries, confirmed red against the old code (all 3 entries survived the rollback) and green against the fix (the 2 drainable entries are durably gone from `platform_audit_pending_entries` and recorded in `platform_audit_events`, even though the call still rejects for the poisoned one and `active` stays `true`). Confirmed the opportunistic auto-drain path (never throws, runs inside the triggering action's own transaction) is unaffected. Full `maintenance-mode.test.ts` (10/10), full `platform-audit`/`audit-or-fail-closed` suite (11 files/83 tests), and `make ci` (typecheck/lint/migrate/full test suite incl. apps/api 203/203/jscpd/openapi.json freshness) all green. Prior implementation history: implemented 2026-07-07 via TDD dev-story pass — platform_audit_events/platform_audit_maintenance_state/platform_audit_pending_entries schema+migration (0041) with RLS/append-only trigger/grant revoke (AC-1-5,22); getPlatformAuditKey() key lifecycle wired into initVault()/unsealVault() (D3); writePlatformAuditEntry()/writePlatformAuditEntryOrFailClosed() with FORBIDDEN_AUDIT_KEYS redaction and fail-closed invariant (AC-6); maintenance-mode activate/deactivate/FIFO-drain (AC-14-16, D8), retention purge fn + daily job (migration 0042, AC-17), independent platform_audit_storage.* monitoring extension to audit-storage-check.ts (AC-18); three new /api/v1/platform/* routes with X-Log-Scope header + platform-operator/MFA gating (AC-9-13,20); retrofitted platform_audit_events writes into all five already-merged 9.1/9.2 route handlers (AC-7,8); concurrency coverage (AC-19). Found and fixed 3 real bugs via full-suite TDD: opportunistic-drain auto-deactivating maintenance mode when nothing was queued; a route response-schema gap causing vaultGuard's sealed-vault body to fail serialization (silent 500) on any route declaring bare 503 schemas (fixed on retrofitted backup routes + this story's own routes); and a test-isolation bug in this story's own audit-storage-check.test.ts additions leaking an org-scoped audit_storage.critical alert into the rest of the suite. Also fixed 15 pnpm turbo lint errors and 2 route-audit.test.ts classification-registry gaps (ROUTE_ACTION_CLASSIFICATIONS + DIRECT_DB_ACCESS_CLASSIFICATIONS) this story's new code triggered; pnpm jscpd reduced to 0 clones by exporting/reusing hmacMatches/buildVerifySummary/rangeErrorResponse/validateVerifyRange/finalizeVerifyResult from modules/audit/verify.ts instead of duplicating, plus two new key-service.ts helpers. Final full isolated apps/api regression run: 187 files (184 passed)/1655 tests (1648 passed) — the 3 "failed" files are 2 pre-existing unrelated @project-vault/agent build-resolution failures plus orgs-routes.test.ts, whose 7 failures are a confirmed pre-existing shared-dev-DB slug-collision artifact (allocateOrganizationSlug's MAX_SLUG_ATTEMPTS=5 exhausted by this session's own many repeated manual re-runs of a test that creates real, never-cleaned-up orgs literally named "Org A"/"Org B"), independently root-caused via an isolated repro against unmodified createOrg() code — not a Story 9.4 regression. Every platform-audit-specific test file passed with zero failures. make check-rls/check-migration-compatibility/check-env-example/check-search-index/check-alert-pending-epic3/check-audit-baseline/check-audit-actor-token-coverage all green; openapi.json regenerated. See story's Key Design Decisions (D1-D11) and Dev Agent Record for full rationale, deviations, and accepted test-coverage gaps.
