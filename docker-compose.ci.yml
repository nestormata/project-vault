# Overlay for `make ci` (see Makefile's `ci` target + Dockerfile.ci + docs/development.md).
# Applied on top of docker-compose.yml via `-f docker-compose.yml -f docker-compose.ci.yml`
# so the `ci` service joins the same Compose project/network as `db` — reachable by its service
# name `db` on the internal Docker network, never through a host-published port. That's the whole
# point: Compose already namespaces containers/volumes/networks per-worktree (by directory name),
# so a container-to-container connection is isolated "for free," with none of the host-port
# collision risk `make test`/`make ci` had when they ran directly on the bare host and connected
# via `localhost:$DB_HOST_PORT` — a value only actually distinct across worktrees if someone
# remembered to run `make fix-ports` first, and one `rm .env` away from silently reverting to the
# same default every worktree starts with.
services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    environment:
      NODE_ENV: test
      # Container-internal host/port for `db` — always correct regardless of whatever (if
      # anything) is published to the actual machine, so no per-worktree port math is needed
      # here at all. See Makefile's DB_CONN_HOST for how this overrides the bare-host default.
      DB_CONN_HOST: db
      DB_HOST_PORT: "5432"
    volumes:
      # .git is excluded from the image (.dockerignore) — bind-mounted read-only here instead so
      # git-history-dependent checks (generated-spec/openapi drift and other repository checks) see
      # the real repo
      # without requiring an image rebuild on every commit.
      #
      # In a git worktree (see docs/development.md "Docker port isolation"), ./.git is a plain
      # *file* containing `gitdir: <absolute host path
      # under the main repo's .git/worktrees/...>`, not a directory. Bind-mounting only that file
      # leaves the absolute path it points to missing inside the container, so git fails with
      # "not a git repository: (null)". Mounting the resolved common git dir (GIT_COMMON_DIR, set
      # by the `ci` Makefile target via `git rev-parse --git-common-dir`) at the *same* absolute
      # path inside the container makes that pointer resolve correctly. For a non-worktree
      # checkout this is the repo's own .git dir, already covered by the mount above — the second
      # mount is then just a harmless duplicate at an unused path.
      - ./.git:/app/.git:ro
      - ${GIT_COMMON_DIR}:${GIT_COMMON_DIR}:ro
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
