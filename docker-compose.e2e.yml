# Story 10-1: E2E-only override — adds VAULT_ALLOW_REMOTE_INIT=true to the `api` service so
# global-setup.ts (apps/web/e2e/global-setup.ts) can call POST /api/v1/vault/init without a
# bootstrap token, plus a raised AUTH_RATE_LIMIT_MAX (see apps/api/src/config/env.ts) so this
# suite's real registrations/logins/MFA calls don't trip the default 60/min global auth rate
# limiter (empirically confirmed necessary, not speculative — see this story's Dev Notes). The
# same fastify plugin instance also covers GET /api/v1/auth/me, which every `(app)` route's
# server-side load function calls once per navigation — across 13 specs' worth of page loads this
# adds up well past even a few hundred/minute, hence the generous headroom below rather than a
# number just above the story's original ~7-9-registrations estimate. Deliberately NOT merged into
# the base docker-compose.yml's `api` service — that would silently weaken every developer's
# default local stack's bootstrap-token/rate-limit protection (docs/runbook.md: "Never leave
# VAULT_BOOTSTRAP_TOKEN blank in production... local-dev convenience only"). Start it only through
# `scripts/e2e-stack.sh up` (Story 66.1; this is what `make e2e` and nightly.yml's `e2e` job do):
# the api keeps NODE_ENV=production, so it needs the script's per-run throwaway secrets. A bare
# `docker compose -f docker-compose.yml -f docker-compose.e2e.yml up` falls back to the base file's
# dev literals, which production validation rejects. Never set NODE_ENV or any secret here.
services:
  api:
    build:
      # Story 14.3 Task 10: only the e2e image is built with the mock external-IdP fixture
      # bundled in (see apps/api/Dockerfile's INCLUDE_MOCK_SSO_EXTENSION ARG) — the base
      # docker-compose.yml build never sets this, so every other build (local dev, production)
      # stays exactly as before.
      args:
        INCLUDE_MOCK_SSO_EXTENSION: 'true'
    environment:
      VAULT_ALLOW_REMOTE_INIT: 'true'
      AUTH_RATE_LIMIT_MAX: '100000'
      AUTH_REGISTER_RATE_LIMIT_MAX: '1000'
      AUTH_SSO_DOMAIN_LOOKUP_RATE_LIMIT_MAX: '1000'
      # Story 14.3 Task 10: loads the in-process mock external-IdP extension (never a real
      # network call) so sso-login.spec.ts can exercise start -> callback -> session-issuance
      # end to end. Deliberately only set here, never in the base docker-compose.yml/.env.example
      # (see fixtures/mock-sso-extension/README.md's "Production-safety" section) — same
      # e2e-only-override precedent as the vars above.
      VAULT_EXTENSIONS_PACKAGE: '@project-vault/mock-sso-extension'
      VAULT_EXTENSIONS_ALLOW_API_VERSION_ABOVE_HOST: 'false'
      # Story 43.7 (e2e-only): a populated CLI version policy so j29 exercises the Version &
      # Upgrade page's minimum/withdrawn rendering against the real API. No other journey reads the
      # CLI policy. The e2e api is a dev build (no RELEASE_VERSION), so `current` is null and the
      # page's self-contradiction warnings cannot fire — the seed has no side effects.
      CLI_MINIMUM_SUPPORTED_VERSION: '1.1.0'
      CLI_WITHDRAWN_VERSIONS: '1.2.1,1.2.2-rc.1'
  # Story 66.1 D-5: no host ports for mailpit under the e2e override, so two worktrees can run
  # `make e2e` at the same time (the base file publishes fixed 127.0.0.1:8025/1025, which the
  # second stack cannot bind). No e2e journey reads mailpit from the host; the api reaches it on the
  # compose network. `!reset` needs Docker Compose >= 2.24 (scripts/e2e-stack.sh prints the version).
  mailpit:
    ports: !reset []
