sonar.organization=nestormata
sonar.projectKey=nestormata_project-vault
sonar.projectName=project-vault

sonar.sources=apps,packages,scripts
# Applied migration SQL is immutable history; exclude it rather than rewriting shipped DDL to
# satisfy non-actionable duplication findings such as plsql:S1192.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.svelte-kit/**,**/coverage/**,**/.turbo/**,**/.stryker-tmp/**,**/reports/**,**/*.d.ts,packages/db/src/migrations/**,packages/shared/openapi.json,packages/vault-action/dist/**,packages/eslint-config/**

sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

sonar.sourceEncoding=UTF-8

# Story 10.4: coverage-only exclusions. These paths remain analyzed for issues/duplication/
# hotspots (sonar.sources/sonar.exclusions above are unchanged) but are precisely excluded from
# the coverage denominator because they are test infrastructure, tooling, or a black-box
# conformance harness rather than product runtime code — see docs/sonarqube.md for the rationale
# per entry. Do NOT add product paths here to raise the metric (AC-B3), and do NOT move any of
# these into sonar.exclusions above, which would additionally hide them from issue analysis
# (AC-B2). `scripts/**` here is the root-level operator/CI tooling directory only; it does not
# match runtime `apps/api/src/scripts/**`, which stays covered.
sonar.coverage.exclusions=\
  apps/web/e2e/**,\
  scripts/**,\
  apps/api/src/__tests__/**,\
  apps/api/src/**/*-test-helpers.ts,\
  apps/api/src/**/*-test-bootstrap.ts,\
  packages/db/src/test-db-urls.ts,\
  apps/web/src/lib/test/**,\
  packages/api-contract-tests/**

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/agent/coverage/lcov.info,packages/cli/coverage/lcov.info,packages/crypto/coverage/lcov.info,packages/db/coverage/lcov.info,packages/extension-api/coverage/lcov.info,packages/shared/coverage/lcov.info,packages/vault-action/coverage/lcov.info

# AGENTS.md exception: signed off by Nestor 2026-09-27
# Story 43.9 (Epic 43 completion: replace inline Sonar suppressions with real fixes), "Decisions
# (Nestor, 2026-09-27)" item 2. Expert consult: Fly 6PN is WireGuard-only and the api app has no
# public IP, but this hop carries cookies, passwords, secrets and MFA codes in plaintext HTTP, so
# the residual risk is low but not zero.
# Real fix tracked as 43-16-epic-43-completion-tls-on-the-fly-internal-api-hop: TLS with a pinned
# private CA, or mTLS, on the web->api internal hop; it also covers the DB
# postgresql://...internal:5432 URL, which has no sslmode.
# Scope: shell:S5332 ("clear-text protocol") on scripts/fly-setup.sh's API_BASE_URL only, which is
# dialed over Fly.io's private 6PN network (<app>.internal); the api terminates no TLS, so
# https:// there would simply fail today. An inline suppression comment was tried first but did
# not survive a full branch-analysis rescan for this rule (it's tagged "former-hotspot"
# internally and appears not to honor inline suppressions the way ordinary code-smell rules
# do) — this scanner-level ignore is the mechanism that works across both PR and branch
# analysis. scripts/check-no-sonar-suppressions.ts accepts exactly this block and nothing else.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/fly-setup.sh
