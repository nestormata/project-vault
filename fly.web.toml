# Fly.io self-hosted web app for the project-vault demo stack — the only public app in
# the demo. It proxies /api/v1/* and /ready server-side to the private `api` app (see
# fly.api.toml), so this is the single origin the browser ever talks to.
app = "project-vault-demo-web"
primary_region = "iad"

[build]
  dockerfile = "apps/web/Dockerfile"
  # Build context is this file's directory (repo root), matching docker-compose.yml.

[env]
  NODE_ENV = "production"
  # API_BASE_URL is set via `fly secrets set` (scripts/fly-setup.sh) to
  # https://project-vault-demo-api.internal:3000 — internal-only, never a public URL. Story 43.16:
  # TLS 1.3 + mTLS with the demo's private CA; API_TLS_CA_B64 / API_TLS_CLIENT_CERT_B64 /
  # API_TLS_CLIENT_KEY_B64 are staged by scripts/fly-internal-tls.sh (docs/runbooks/fly-internal-tls.md).
  # Story 60.1: this demo topology has no CentralizeMe integration configured today, so there is
  # no CORS_ALLOWED_ORIGINS entry here. A future CM integration on this Fly app would need
  # CORS_ALLOWED_ORIGINS set via `fly secrets set` the same way API_BASE_URL is — list only the
  # origin(s) you actually trust to receive PV session cookies and vault data.
  # Story 60.4: VAULT_HANDOFF_ISSUER is likewise unset here, so the /handoff consent page shows
  # plain-text "Return to CentralizeMe" guidance (no link) — set it only alongside a CM integration.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
