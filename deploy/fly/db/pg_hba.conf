# Fly demo Postgres client authentication (Story 43.16 AC-4 / AC-12).
#
# - Unix socket: trust, exactly like the stock image's default. The entrypoint's initdb and
#   /docker-entrypoint-initdb.d scripts, and `fly ssh console` + psql, use it.
# - Every network connection must be TLS (hostssl; ssl_min_protocol_version = TLSv1.3) AND present
#   a client certificate chained to the private CA (clientcert=verify-ca) AND pass scram-sha-256.
#   verify-ca, not verify-full: Postgres' verify-full requires the certificate CN to equal the DB
#   user, but the api connects as both vault_app and vault_admin with one certificate.
# - Plaintext network connections are rejected outright.
#
# TYPE  DATABASE USER ADDRESS      METHOD
local   all      all               trust
hostssl all      all  0.0.0.0/0    scram-sha-256 clientcert=verify-ca
hostssl all      all  ::/0         scram-sha-256 clientcert=verify-ca
host    all      all  0.0.0.0/0    reject
host    all      all  ::/0         reject
