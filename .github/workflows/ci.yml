name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Story 64.4: base-image-refresh.yml dispatches CI on its refresh branch, because a PR opened with
  # GITHUB_TOKEN does not trigger `pull_request` workflows. Also handy for a manual re-run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast pre-checks: typecheck/lint/static checks plus everything that ran before the slow
  # "Test (with coverage)" step in the old single-job pipeline. Runs in parallel with the two
  # test shards below (test-api-db, test-web-other) — it does NOT gate them, since it doesn't
  # produce anything they consume. It still needs its own Postgres service: migrations,
  # check-rls, and the API contract parity tests all touch a live, migrated database.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Derived from the postgres: service block below — keep in sync if it changes.
      SUPERUSER_DATABASE_URL: postgresql://postgres:password@localhost:5432/project_vault
      VAULT_APP_DATABASE_URL: postgresql://vault_app:dev-only-change-in-prod@localhost:5432/project_vault
      ADMIN_DATABASE_URL: postgresql://vault_admin:password@localhost:5432/project_vault
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: project_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check container publish workflow contract
        run: pnpm vitest run scripts/check-container-publish-workflow.test.ts

      - name: Check image scan workflows contract (Story 64.3 AC-5)
        run: pnpm vitest run scripts/check-image-scan-workflows.test.ts

      - name: Check e2e stack script contract (Story 66.1 AC-7)
        run: pnpm vitest run scripts/e2e-stack.test.ts

      - name: Check docker compose config contract (Story 60.1/43.7/60.4/60.7)
        run: pnpm vitest run scripts/check-compose-config.test.ts

      - name: Check base image digest lockstep guard (Story 64.1 AC-2)
        run: pnpm vitest run scripts/check-base-image-digest.test.ts

      - name: Check base image refresh workflow contract (Story 64.4)
        run: pnpm vitest run scripts/check-base-image-refresh-workflow.test.ts

      - name: Check third-party action SHA pins (Story 64.2 AC-3)
        run: pnpm vitest run scripts/check-action-pins.test.ts

      - name: Check the no-agent-attribution guard (Story 66.21 AC-7)
        run: pnpm vitest run scripts/check-no-agent-attribution.test.ts

      - name: Check no pnpm override makes a declared range false (Story 68.2 AC-1)
        run: pnpm vitest run scripts/check-no-false-overrides.test.ts

      - name: Check the web-host release workflow contract (Story 68.2 AC-10, Story 68.3)
        run: pnpm vitest run scripts/check-web-host-release-workflow.test.ts

      - name: Check the npm release verification helper (Story 68.12 AC-5)
        run: pnpm vitest run scripts/verify-npm-release.test.ts

      # The integration test itself runs in the `Composition kit integration` job; here only its
      # wiring assertions run (it prints SKIPPED without COMPOSITION_KIT_INTEGRATION=1).
      - name: Check the composition kit's release version triangle and integration wiring (Story 68.3)
        run: pnpm vitest run scripts/check-release-version-triangle.test.ts scripts/check-composition-kit-integration.test.ts

      - name: Check the kit's route classification file parses with the runtime route audit (Story 68-16)
        run: pnpm vitest run scripts/check-composition-kit-route-classifications.test.ts

      - name: Check PV web guards run over a composed tree (Story 68.9)
        run: pnpm vitest run scripts/check-web-guard-completeness.test.ts scripts/check-web-guard-symmetry.test.ts scripts/check-web-guard-wiring.test.ts scripts/check-form-guidance.test.ts

      # Story 43.11 AC-6.4: the story-integrity guards' own test suites. --dir scripts limits
      # vitest discovery to ./scripts (positional args are substring filters). The overlay guards
      # themselves print SKIPPED here: public CI never has the private _bmad-output overlay.
      - name: Check story-integrity guards' own test suites (Story 43.11)
        run: pnpm vitest run --dir scripts check-sprint-status-rollup.test.ts check-story-status-sync.test.ts check-deferred-work-ids.test.ts next-dw-id.test.ts lib/deferred-work-ledger.test.ts check-ci-story-integrity-wiring.test.ts check-review-tradeoff-ledger.test.ts check-review-tradeoff-ledger-sections.test.ts check-deferred-work-triggers.test.ts lib/dw-trigger-hits.test.ts warn-fired-dw-triggers.test.ts

      - name: Check pvault CLI release workflow contract (Story 43.6 AC-5)
        run: pnpm vitest run scripts/check-cli-release-workflow.test.ts

      # Story 43.14 AC-8: the guard raw-loads apps/web's cli-version-policy-view.ts, and Vite
      # resolves that file's tsconfig (which extends the generated .svelte-kit/tsconfig.json) even
      # for a ?raw import. Generate it first, as the SonarCloud job does.
      - name: Generate SvelteKit config for the CLI docs guard
        run: pnpm --filter @project-vault/web-host exec svelte-kit sync

      - name: Check CLI docs name the pvault binary and document every command (Story 43.14)
        run: pnpm vitest run scripts/check-cli-docs-naming.test.ts

      - name: Check extension-api version-skew guard's own test suite (Story 24.4)
        run: pnpm vitest run scripts/check-extension-api-version-skew.test.ts

      - name: Check extension authoring guide documents every ActionResult outcome (Story 59.2)
        run: pnpm vitest run scripts/extension-authoring-docs.test.ts

      - name: Check delegation alert rules name real outcomes and the runbook documents them (Story 71.9)
        run: pnpm vitest run scripts/check-delegation-alert-rules.test.ts

      - name: Check extension-api versioning policy guards (Story 23.6)
        run: >-
          pnpm vitest run scripts/check-policy-doc-structure.test.ts
          scripts/check-policy-doc-content.test.ts
          scripts/check-extension-api-behaviour.test.ts
          scripts/check-extension-api-markers.test.ts
          scripts/check-extension-api-contract-changelog.test.ts
          packages/extension-api/src/api-surface.test.ts

      - name: Check published extension-api policy artifacts (Story 23.6)
        run: >-
          pnpm check-extension-api-policy &&
          pnpm check-extension-api-policy-content &&
          pnpm check-extension-api-behaviour &&
          pnpm check-extension-api-markers &&
          pnpm check-extension-api-contract-changelog

      - name: Check native-credential-surface guard's own test suite (Story 23.2 AC19)
        run: pnpm vitest run scripts/check-native-credential-surface.test.ts

      - name: Check committed CLI/agent build-info stays unstamped (Story 43.6 AC-5)
        run: |
          pnpm check-build-info-unstamped &&
          pnpm vitest run scripts/check-build-info-unstamped.test.ts scripts/stamp-build-info.test.ts

      - name: Check web svelte-check wiring (Story 68.1 AC-4)
        run: pnpm vitest run scripts/check-web-svelte-check-wiring.test.ts

      - name: Typecheck (tsc + svelte-check)
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Provision local test admin role credential
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE vault_admin PASSWORD 'password'"

      - name: Check RLS policy coverage
        run: pnpm check-rls
        env:
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}

      - name: Check function executability invariant (Story 24.5b)
        run: pnpm check-function-executability
        env:
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}

      - name: Check function executability focused tests (Story 24.5b)
        run: pnpm vitest run --no-file-parallelism packages/db/src/function-executability.test.ts scripts/check-function-executability.test.ts
        env:
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}
          SUPERUSER_DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Check search index safety (RS-E2a)
        run: pnpm check-search-index

      - name: Check migration compatibility (AC-E9b)
        run: pnpm check-migration-compatibility

      # A workflow_dispatch run (base-image-refresh.yml gates its PR this way) checks out only the
      # dispatched branch, so the guard's local fork-point base `main` does not exist and it dies
      # with an unresolvable `main...HEAD` range. History is full (fetch-depth 0); only the ref is
      # missing. Skipped on main itself, where `main` is the checked-out branch.
      - name: Create the local main ref for the version-skew guard (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: git fetch --no-tags origin main:refs/heads/main

      - name: Check extension-api version-skew (Story 14.1 AC7 / Story 24.4)
        run: pnpm check-extension-api-version-skew

      - name: Check extension-api and composition-kit are MIT and the repository root stays AGPL
        run: |
          pnpm check-extension-api-license &&
          pnpm vitest run scripts/check-extension-api-license.test.ts

      - name: Check the composition kit's MIT boundary (Story 68.3)
        run: |
          pnpm check-composition-kit-boundary &&
          pnpm vitest run scripts/check-composition-kit-boundary.test.ts

      - name: Check injection point coverage (Story 68.4)
        run: |
          pnpm check-injection-point-coverage &&
          pnpm vitest run scripts/check-injection-point-coverage.test.ts

      - name: Check monolithic regions (Story 68.10)
        run: |
          pnpm check-monolithic-regions &&
          pnpm vitest run scripts/check-monolithic-regions.test.ts scripts/lib/route-files.test.ts

      - name: Check route regions (Story 69.5)
        run: |
          pnpm check-route-regions &&
          pnpm vitest run scripts/check-route-regions.test.ts

      - name: Check the mock UI pack mechanism wiring (Story 68.10)
        run: pnpm vitest run scripts/check-mock-ui-pack-e2e-wiring.test.ts scripts/lib/web-host/consumer-tarballs.test.ts scripts/mock-ui-pack-seed.test.ts scripts/check-pv-nav-snapshot.test.ts scripts/check-mock-ui-pack-not-in-production.test.ts scripts/check-runtime-route-audit-shipped.test.ts scripts/lib/shipped-route-audit.test.ts

      - name: Check nav ids and nav surfaces (Story 68.7)
        run: |
          pnpm check-nav-ids &&
          pnpm vitest run scripts/check-nav-ids.test.ts &&
          pnpm check-nav-surfaces &&
          pnpm vitest run scripts/check-nav-surfaces.test.ts

      - name: Check native-credential surface (Story 23.2 AC19)
        run: pnpm check-native-credential-surface

      - name: Check no unsigned Sonar suppressions (Story 43.9 AC-9)
        run: |
          pnpm check-no-sonar-suppressions &&
          pnpm vitest run scripts/check-no-sonar-suppressions.test.ts scripts/lib/trusted-executable.test.ts

      - name: Check lint guards and lint:changed wiring (Story 66-17)
        run: pnpm vitest run scripts/lint-changed-sonar.test.ts scripts/check-shell-positional-params.test.ts scripts/eslint-test-guards-wiring.test.ts

      - name: Check Stryker config invariants (Story 66-7)
        run: pnpm vitest run scripts/check-stryker-config.test.ts

      - name: Check nightly workflow gate and flaky-repeat matrix (Story 66-11)
        run: pnpm vitest run scripts/check-nightly-workflow.test.ts

      - name: Check PR e2e smoke gate and job wiring (Story 66-20)
        run: pnpm vitest run scripts/pr-e2e-smoke-gate.test.ts

      - name: Check Fly scripts, workflows and pinned-CA call sites (Story 43.16 AC-3/AC-5, 43.28)
        run: pnpm vitest run scripts/fly-setup.test.ts scripts/fly-internal-tls.test.ts scripts/check-pg-tls-call-sites.test.ts scripts/check-fly-deploy-workflow.test.ts scripts/fly-ensure-started.test.ts

      - name: Check for duplicate code
        run: pnpm jscpd

      - name: Check .trivyignore entries
        run: |
          if grep -qE "^CVE" .trivyignore 2>/dev/null; then
            TODAY=$(date +%Y-%m-%d)
            while IFS= read -r line; do
              if [[ "$line" =~ ^#\ exp:\ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
                EXP="${BASH_REMATCH[1]}"
                if [[ "$EXP" < "$TODAY" ]]; then
                  echo "ERROR: Expired .trivyignore entry: exp $EXP"
                  exit 1
                fi
              fi
            done < .trivyignore
          fi
          echo ".trivyignore check passed"

      - name: Check audit-ci baseline
        run: pnpm tsx scripts/check-audit-baseline.ts

      - name: Check audit-ci baseline guard's own test suite (Story 42.2)
        run: pnpm vitest run scripts/check-audit-baseline.test.ts

      - name: Check crypto-adjacent dependency pins + CODEOWNERS sync (Story 42.3 / 42.5)
        run: pnpm check-crypto-adjacent-pins

      - name: Check crypto-adjacent pins guard's own test suite (Story 42.3 / 42.5)
        run: pnpm vitest run scripts/check-crypto-adjacent-pins.test.ts

      - name: Check .env.example parity
        run: pnpm tsx scripts/check-env-example.ts

      - name: Audit dependencies
        run: pnpm exec audit-ci --config audit-ci.jsonc

      - name: Validate commitlint (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          pnpm commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

      - name: Generate spec and check freshness
        run: |
          pnpm generate-spec
          git diff --exit-code packages/shared/openapi.json || \
            (echo "ERROR: openapi.json is stale - run pnpm generate-spec and commit" && exit 1)

      - name: API contract parity tests (Story 9.3 D6/AC-8/AC-9/AC-10)
        run: pnpm --filter @project-vault/api-contract-tests test
        env:
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}

      - name: Check vault-action dist/ freshness (D6/AC-11)
        run: pnpm check-vault-action-dist

  # Shard 1 of 2 for the slow `pnpm turbo test` workload: apps/api + packages/db + packages/cli.
  # apps/api and packages/db are kept together (not split from each other) because turbo.json
  # declares an explicit task dependency (`@project-vault/api#test` dependsOn
  # `@project-vault/db#test`); packages/cli rides along here too because its e2e test
  # (src/get-command.e2e.test.ts) boots a real @project-vault/api server against this same
  # Postgres. These three are the only packages under test that need a live Postgres connection —
  # packages/agent, packages/crypto, packages/shared and packages/vault-action reference the
  # literal string "DATABASE_URL" only in test fixtures (parse-secrets classification), never a
  # real connection. By test-file count this shard is apps/api (228) + packages/db (40) = 268
  # files, vs. 212 in the other shard — not exactly even, but close.
  #
  # Within this shard, the combined suite is further split 2-way via vitest's own `--shard` flag
  # (matrix below), each leg getting its own isolated Postgres service so there's no risk of two
  # shards racing against the same migrated schema. This roughly halves this job's wall-clock time
  # (previously observed running 35-45+ min and occasionally getting cancelled by the timeout).
  # Coverage thresholds are disabled for this sharded run (see CI_COVERAGE_SHARDED in
  # apps/api/vitest.config.ts and packages/db/vitest.config.ts, and the --coverage.thresholds.*
  # CLI overrides below for packages/cli, which has no such env-gated config) since each shard
  # only exercises part of the suite and would otherwise fail on an artificially low per-shard
  # coverage number; the `sonar` job below merges all shards' lcov.info via `lcov --add-tracefile`
  # and SonarCloud's Quality Gate is the real coverage enforcement point.
  test-api-db:
    name: Test (api + db)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Observed ~15 min per shard after splitting (vs. 35-45+ min single-job before). Raised to
    # 60 rather than lowered, on top of the split, for headroom against a loaded runner —
    # apps/api/src/__tests__/deployment-hardening.test.ts enforces a >=45 floor here specifically
    # so this can't be quietly dropped back down in a future edit; keep any change to this value
    # in sync with that test. If cancelled before uploading LCOV, the Sonar job analyzes partial
    # coverage and reports a misleading gate failure.
    timeout-minutes: 60
    env:
      SUPERUSER_DATABASE_URL: postgresql://postgres:password@localhost:5432/project_vault
      VAULT_APP_DATABASE_URL: postgresql://vault_app:dev-only-change-in-prod@localhost:5432/project_vault
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: project_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          # matrix.shard is part of the key: this job id ("test-api-db") is shared by both
          # matrix legs, and each leg passes a different --shard flag to vitest, so a cache
          # entry from one shard must never be restored into the other (it would make one leg
          # silently reuse the wrong half's turbo output).
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ matrix.shard }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm db:migrate` is a raw workspace script, not a `pnpm turbo` task, so it never
      # triggers turbo's `^build` dependency chain — `packages/db` needs
      # `@project-vault/shared`'s dist/ output to exist first (guarded-migrate.ts imports
      # it). In the old single-job pipeline this was built as a side effect of the earlier
      # `pnpm turbo typecheck` step (typecheck depends on generate-spec depends on ^build);
      # this job has no typecheck step, so it needs its own explicit build.
      - name: Build workspace packages
        run: pnpm turbo build --filter=@project-vault/api --filter=@project-vault/db

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Provision local test admin role credential
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE vault_admin PASSWORD 'password'"

      # --shard=<matrix.shard>/2 splits each package's own test-file list in half (vitest
      # shards per-project, so apps/api and packages/db are each split independently, not as one
      # combined pool). Each matrix leg has its own isolated Postgres service (see `services:`
      # above), so there's no risk of the two shards racing against the same schema.
      # packages/cli's e2e test (src/get-command.e2e.test.ts) boots a real @project-vault/api
      # server and needs the same live, migrated Postgres this job already provisions for
      # apps/api + packages/db — see packages/cli/README.md "Running the e2e test". It's included
      # in the same sharded `turbo test` invocation as api/db (vitest shards per-project, so its
      # small suite just rides along in whichever shard turbo assigns it).
      - name: Test (with coverage) - api, db, cli
        run: >-
          pnpm turbo test --filter=@project-vault/api --filter=@project-vault/db
          --filter=@project-vault/cli --
          --shard=${{ matrix.shard }}/2
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
        env:
          # Must use vault_app, not postgres — the postgres superuser bypasses RLS
          # entirely, which would make the RLS isolation tests pass even if policies
          # were broken or missing.
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}
          # check-rls-coverage.test.ts needs superuser access to create/drop its
          # throwaway test database and manage RLS policies directly. The Story 24.5a
          # function-grant denial test uses the same SUPERUSER_DATABASE_URL wiring for its
          # randomized throwaway role lifecycle; no additional CI credential is needed.
          ADMIN_DATABASE_URL: postgresql://vault_admin:password@localhost:5432/project_vault
          # Belt-and-suspenders alongside the CLI --coverage.thresholds.* overrides above: also
          # tells each vitest.config.ts to omit `thresholds` entirely for this sharded run (see
          # those files for why a per-shard threshold is a false signal, not a real regression).
          CI_COVERAGE_SHARDED: 'true'

      - name: Upload RLS isolation coverage (SOC2 Type II evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-coverage-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: packages/db/coverage/
          retention-days: 90

      # Feeds the sonar job below, which needs coverage from both api-db shards (and the
      # web-other shard) to report accurate project-wide numbers. Uploaded even on failure —
      # vitest writes LCOV to disk before evaluating coverage thresholds, so a local threshold
      # miss shouldn't blank out the SonarCloud dashboard for this shard's packages. Named per
      # matrix.shard since both legs share this job id and upload-artifact rejects duplicate
      # names within one run; the sonar job merges the two via `lcov --add-tracefile`.
      - name: Upload coverage for SonarCloud (api, db, cli)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-api-db-${{ matrix.shard }}
          path: |
            apps/api/coverage/
            packages/db/coverage/
            packages/cli/coverage/
          retention-days: 1

  # Shard 2 of 2: everything under test that does NOT need a live Postgres connection. No
  # postgres service here on purpose — apps/web, packages/agent, packages/crypto,
  # packages/shared, packages/vault-action, and packages/extension-api tests never open a real DB
  # connection (verified: the only "DATABASE_URL" references in their test files are string
  # literals used as classification fixtures in packages/vault-action's parse-secrets tests). 212
  # test files vs. 268 in test-api-db — the other shard runs a bit longer, but it also carries
  # strictly more of the historically-slow work (apps/api's integration-style suite), so this is
  # the more useful place to spend the balance rather than forcing an exact 50/50 file-count split.
  test-web-other:
    name: Test (web + other packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit config for SonarCloud
        run: pnpm --filter @project-vault/web-host exec svelte-kit sync

      - name: Test (with coverage) - web, agent, crypto, shared, vault-action, extension-api, composition-kit
        run: >-
          pnpm turbo test --filter=@project-vault/web-host --filter=@project-vault/shared
          --filter=@project-vault/agent --filter=@project-vault/crypto
          --filter=@project-vault/vault-action --filter=@project-vault/extension-api
          --filter=@project-vault/composition-kit

      - name: Upload coverage for SonarCloud (web, agent, crypto, shared, vault-action, extension-api, composition-kit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-web-other
          path: |
            apps/web/coverage/
            apps/web/.svelte-kit/tsconfig.json
            packages/agent/coverage/
            packages/crypto/coverage/
            packages/shared/coverage/
            packages/vault-action/coverage/
            packages/extension-api/coverage/
            packages/composition-kit/coverage/
          retention-days: 1

  extension-api-compatibility:
    name: Extension API compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension API
        run: pnpm --filter @project-vault/extension-api build

      - name: Typecheck extension API
        run: pnpm --filter @project-vault/extension-api typecheck

      - name: Test extension API
        run: pnpm --filter @project-vault/extension-api test

  # Combines both shards' coverage before running SonarCloud, so project-wide coverage numbers
  # reflect the whole suite rather than just one shard. `if: ${{ !cancelled() }}` at the job
  # level (not just on the individual steps) is required here: GitHub Actions skips a job's
  # `needs` dependents by default when an upstream job fails, and this job must still run — with
  # whatever partial coverage made it into the uploaded artifacts — even if a test shard failed
  # on a coverage-threshold miss, matching the old single-job behavior where a failed Test step
  # didn't block the Sonar steps that followed it.
  sonar:
    name: SonarCloud
    needs: [test-api-db, test-web-other]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # test-api-db now runs as a 2-way matrix (see that job), each leg uploading its own
      # partial lcov.info under a shard-numbered artifact name. Downloaded into separate
      # directories here, then merged below — sonar.javascript.lcov.reportPaths expects exactly
      # one lcov.info at apps/api/coverage/lcov.info, packages/db/coverage/lcov.info, and
      # packages/cli/coverage/lcov.info, so the two shards' partial reports must be combined
      # into a single file at each of those paths before the scan step runs.
      - name: Download coverage (api, db, cli) - shard 1
        uses: actions/download-artifact@v8
        with:
          name: coverage-shard-api-db-1
          path: coverage-parts/shard-1

      - name: Download coverage (api, db, cli) - shard 2
        uses: actions/download-artifact@v8
        with:
          name: coverage-shard-api-db-2
          path: coverage-parts/shard-2

      - name: Download coverage (web, agent, crypto, shared, vault-action)
        uses: actions/download-artifact@v8
        with:
          name: coverage-shard-web-other
          path: .

      # Merges via hit-count union (not concatenation/overwrite) since a shared library file
      # can legitimately be exercised by tests in BOTH shards — simple concatenation would
      # produce duplicate SF: records for such files, which most LCOV consumers resolve by
      # silently taking the last one rather than combining them correctly.
      - name: Merge api/db/cli coverage from both shards
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          mkdir -p apps/api/coverage packages/db/coverage packages/cli/coverage
          lcov --add-tracefile coverage-parts/shard-1/apps/api/coverage/lcov.info \
               --add-tracefile coverage-parts/shard-2/apps/api/coverage/lcov.info \
               --output-file apps/api/coverage/lcov.info \
               --ignore-errors empty,unused
          lcov --add-tracefile coverage-parts/shard-1/packages/db/coverage/lcov.info \
               --add-tracefile coverage-parts/shard-2/packages/db/coverage/lcov.info \
               --output-file packages/db/coverage/lcov.info \
               --ignore-errors empty,unused

          # packages/cli has a small test suite (8 files) split across the same 2-way
          # --shard flag: unlike api/db, one shard leg can plausibly draw zero cli test
          # files, so its lcov.info may not exist in that leg's artifact — build the
          # --add-tracefile args from only the legs that actually produced one.
          cli_tracefiles=()
          for shard_dir in coverage-parts/shard-1 coverage-parts/shard-2; do
            if [ -f "$shard_dir/packages/cli/coverage/lcov.info" ]; then
              cli_tracefiles+=(--add-tracefile "$shard_dir/packages/cli/coverage/lcov.info")
            fi
          done
          if [ "${#cli_tracefiles[@]}" -gt 0 ]; then
            lcov "${cli_tracefiles[@]}" \
                 --output-file packages/cli/coverage/lcov.info \
                 --ignore-errors empty,unused
          fi

      # Runs even if a test shard failed (e.g. a local coverage-threshold miss) — vitest writes
      # its full LCOV/coverage output to disk before evaluating thresholds, so the data
      # SonarCloud needs already exists in the downloaded artifacts. Only a cancelled run skips
      # this, so the dashboard always reflects the latest measured coverage instead of going
      # stale on the last passing run.
      - name: SonarCloud Scan
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarCloud Quality Gate
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build:
    name: Docker Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          # Story 64.3 AC-3: full history so `origin/<base>...HEAD` has a merge base below.
          fetch-depth: 0

      # Story 64.3 AC-3: decides whether this run's image scans (below) are blocking. Only a PR
      # that changes an image input can introduce a new image vulnerability through its own diff;
      # every other run scans in advisory mode so an unrelated PR does not go red the morning a new
      # upstream CVE is published (Story 10-1's reason for keeping image scans nightly-only). On a
      # push to main/dev the scan is advisory too: nightly.yml is the gate there. github.* values
      # reach the script through env:, never `${{ }}` inside run:, to rule out script injection.
      - name: Detect image-input changes
        id: image-inputs
        if: matrix.arch == 'amd64'
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Empty on workflow_dispatch; falls back to the default branch (Story 64.4).
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGES_CHANGED=false
          # Story 64.4: a workflow_dispatch run on a non-default branch (the base-image refresh
          # branch) is gated like a PR against the default branch; on the default branch itself it
          # is advisory, like a push.
          if [[ "$EVENT_NAME" == "pull_request" ]] \
            || [[ "$EVENT_NAME" == "workflow_dispatch" && "${REF_NAME:-}" != "$BASE_REF" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            CHANGED=$(git diff --name-only --no-renames "origin/${BASE_REF}...HEAD")
            for INPUT in apps/api/Dockerfile apps/web/Dockerfile Dockerfile.ci .dockerignore \
              apps/api/docker-entrypoint.sh pnpm-lock.yaml pnpm-workspace.yaml \
              scripts/materialize-deploy-runtime.mjs .trivyignore fly.db.toml \
              patches/@stryker-mutator__vitest-runner.patch; do
              if grep -Fxq -- "$INPUT" <<<"$CHANGED"; then
                echo "Image input changed: $INPUT"
                IMAGES_CHANGED=true
              fi
            done
            # Story 43.16 AC-13: every file under these directories is an image input (fly-db).
            for INPUT_DIR in deploy/fly/db/; do
              if grep -q -- "^${INPUT_DIR}" <<<"$CHANGED"; then
                echo "Image input changed under: $INPUT_DIR"
                IMAGES_CHANGED=true
              fi
            done
          fi
          echo "images_changed=${IMAGES_CHANGED}"
          echo "images_changed=${IMAGES_CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          # Matches container-publish.yml's own target for the published project-vault-api
          # image. Without this, docker/build-push-action builds the Dockerfile's default (last)
          # stage -- which became the `migrate` leaf stage once Story 9.10 added it at the end of
          # the file, silently validating and size-checking an unpruned, dev-toolchain-heavy
          # image instead of the one that actually ships.
          target: runner
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          tags: project-vault-api:ci
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          tags: project-vault-web:ci
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

      # docker load only works for the host platform, so size check runs on amd64 only.
      # amd64 is the primary deployment target; arm64 build success is the validation.
      - name: Load API image for size check
        id: load-api
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          # Same reasoning as the "Build API image" step above: must match the published
          # runner target, not the Dockerfile's default (last) stage.
          target: runner
          load: true
          tags: project-vault-api:size-check
          cache-from: type=gha,scope=api-${{ matrix.arch }}

      - name: Load web image for size check
        id: load-web
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: project-vault-web:size-check
          cache-from: type=gha,scope=web-${{ matrix.arch }}

      # Story 64.3 (beyond AC-3's api+web): the published `migrate` image (apps/api/Dockerfile's
      # minimal `migrate` stage) is built and scanned on PRs too. Without this, a broken or
      # vulnerable migrate stage would first surface at release, in container-publish.yml's gate.
      # It shares the builder/db-builder stages with the api image, so it reads the api build's
      # cache; only its own small migrate-deploy/migrate layers go to a separate scope.
      - name: Load migrate image for scan
        id: load-migrate
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          load: true
          tags: project-vault-migrate:size-check
          cache-from: |
            type=gha,scope=api-${{ matrix.arch }}
            type=gha,scope=migrate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=migrate-${{ matrix.arch }}

      # Story 43.16 AC-13: the Fly demo's db image (deploy/fly/db). amd64 only — it is deployed to
      # Fly's amd64 machines by `flyctl deploy` from source (never published to GHCR, so there is
      # no release gate for it; nightly.yml is its gate on main).
      - name: Load fly-db image for scan
        id: load-fly-db
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/fly/db/Dockerfile
          target: runner
          load: true
          tags: project-vault-fly-db:size-check
          cache-from: type=gha,scope=fly-db-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fly-db-${{ matrix.arch }}

      - name: Check extension-api deployed tree
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh project-vault-api:size-check -c '
            test -f node_modules/@project-vault/extension-api/dist/index.js
            if find node_modules/@project-vault/extension-api/dist -type f -name "*.test.js" -print -quit | grep -q .; then
              echo "FATAL: production image contains extension-api test JavaScript" >&2
              exit 1
            fi
            echo "extension-api production tree: dist/index.js present; zero *.test.js"
          '

      - name: Check image size
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          MAX_BYTES=$((300 * 1024 * 1024))
          for IMAGE in project-vault-api:size-check project-vault-web:size-check; do
            SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}')
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "FATAL: $IMAGE is ${SIZE} bytes, exceeds 300MB limit"
              exit 1
            fi
            echo "$IMAGE is ${SIZE} bytes — OK"
          done

      # Story 64.3 AC-3: the same settings as nightly.yml's image scans, on the amd64 images that
      # were just loaded (arm64 cannot `load`; container-publish.yml scans both platforms at release).
      # Each scan is `continue-on-error: true` so no scan masks another, and exit-code stays '1' so
      # each step's `outcome` records whether findings exist. The blocking/advisory decision is made
      # once, in "Enforce image scan gate" below, from those outcomes.
      # Why not a `continue-on-error: ${{ steps.image-inputs.outputs.images_changed != 'true' }}`
      # expression on each scan: on this composite action it let a real finding through as green
      # with images_changed=true (throwaway PR #464, run 36439301535). The policy therefore lives in
      # a plain `run:` script fed by `env:`, which reads step outputs reliably.
      # `!cancelled()` + the load step's own outcome: a failed size check or another image's scan
      # never skips this one, and it never runs against an image that was not loaded.
      - name: Scan API image for vulnerabilities
        id: scan-api
        if: ${{ !cancelled() && matrix.arch == 'amd64' && steps.load-api.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: project-vault-api:size-check
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan migrate image for vulnerabilities
        id: scan-migrate
        if: ${{ !cancelled() && matrix.arch == 'amd64' && steps.load-migrate.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: project-vault-migrate:size-check
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan fly-db image for vulnerabilities
        id: scan-fly-db
        if: ${{ !cancelled() && matrix.arch == 'amd64' && steps.load-fly-db.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: project-vault-fly-db:size-check
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan web image for vulnerabilities
        id: scan-web
        if: ${{ !cancelled() && matrix.arch == 'amd64' && steps.load-web.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: project-vault-web:size-check
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # Blocking only when this PR changes an image input (steps.image-inputs); otherwise, and on
      # push to main (nightly is the gate there), findings become ::warning:: annotations.
      - name: Enforce image scan gate
        if: ${{ !cancelled() && matrix.arch == 'amd64' }}
        env:
          IMAGES_CHANGED: ${{ steps.image-inputs.outputs.images_changed }}
          SCAN_API: ${{ steps.scan-api.outcome }}
          SCAN_FLY_DB: ${{ steps.scan-fly-db.outcome }}
          SCAN_MIGRATE: ${{ steps.scan-migrate.outcome }}
          SCAN_WEB: ${{ steps.scan-web.outcome }}
        run: |
          set -euo pipefail
          FAILED=0
          for PAIR in "api:${SCAN_API}" "fly-db:${SCAN_FLY_DB}" "migrate:${SCAN_MIGRATE}" "web:${SCAN_WEB}"; do
            IMAGE="${PAIR%%:*}"
            OUTCOME="${PAIR#*:}"
            if [[ "$OUTCOME" != "failure" ]]; then
              echo "project-vault-${IMAGE}:size-check scan outcome: ${OUTCOME:-not run}"
              continue
            fi
            if [[ "$IMAGES_CHANGED" == "true" ]]; then
              echo "::error title=Image scan (${IMAGE})::project-vault-${IMAGE}:size-check has fixable HIGH/CRITICAL findings (or the scan errored), and this PR changes an image input. See the scan step log."
              FAILED=1
            else
              echo "::warning title=Advisory image scan (${IMAGE})::project-vault-${IMAGE}:size-check has fixable HIGH/CRITICAL findings (or the scan errored). Advisory because this run changes no image input; see the scan step log. Nightly/release gates will block on it."
            fi
          done
          exit "$FAILED"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  post-merge-status-drift:
    name: Post-Merge Status Drift
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run post-merge status drift check
        run: pnpm check-post-merge-status-drift

  # Story 68.2 AC-10: pack @project-vault/web-host exactly as web-host-release.yml does, then prove
  # the tarball (content rules, lockfile drift, the paraglide pin) and an out-of-monorepo consumer
  # build from it. It needs no secret and no OIDC, so fork PRs run it too. Required-check name once
  # green on main: "Web-host pack".
  web-host-pack:
    name: Web-host pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the paraglide plugin pin (AC-5)
        run: pnpm vitest run scripts/check-paraglide-plugin-pinned.test.ts

      - name: Check the web-host pack libraries
        run: pnpm vitest run scripts/lib/web-host scripts/lib/version-triangle.test.ts

      - name: Out-of-monorepo consumer fixture (AC-8)
        env:
          WEB_HOST_FIXTURE: '1'
        run: pnpm vitest run scripts/check-web-host-consumer-fixture.test.ts

      - name: Pack and check the web-host tarball (AC-2, AC-4, AC-6, AC-7, AC-9)
        run: pnpm vitest run scripts/check-web-host-tarball.test.ts

      - name: Build PV's own web app (control group prerequisites)
        run: pnpm turbo build --force --filter=@project-vault/web-host

      - name: PV's own CM-free build is the control group (Story 68.10 AC-9)
        run: pnpm vitest run scripts/check-pv-cm-free-build.test.ts

      - name: Dry-run npm pack of the staged package
        working-directory: .web-host-pack
        run: npm pack --dry-run --json

  # Story 68.10 AC-2/AC-3: the mechanism e2e. It composes the mock UI pack onto the REAL packed
  # web-host, builds the composed web image with Docker, boots it with a real API (the mock module
  # pack, VAULT_EXTENSIONS_REQUIRED=true) and database, and runs Playwright (one spec file per
  # capability M1-M7, retries 0, traces off). The path filter runs INSIDE the job and fails open: a
  # workflow-level `paths:` filter would leave a REQUIRED check pending forever on a PR that skips
  # it, so this job always finishes green and only its heavy steps are conditional. Push to main and
  # dev and manual dispatch always run it. It needs no secret, no OIDC and no registry write, so fork
  # PRs run it too (it does need the public npm registry and Docker Hub).
  # Required status check on main since 2026-10-04 (story 68-19): "Mock UI pack mechanism e2e". The job
  # name is pinned by scripts/check-mock-ui-pack-e2e-wiring.test.ts; renaming it needs a branch-protection change.
  mock-ui-pack-e2e:
    name: Mock UI pack mechanism e2e
    runs-on: ubuntu-latest
    # Measured 2026-10-03 on a laptop: 7.6 minutes warm (npm and Docker caches), about 15 minutes with
    # cold image builds (the api image is the long pole). 45 minutes keeps the cold run under 40 percent
    # of the budget; the 5-minute split rule applies if it ever exceeds 45 (shard by capability).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Path filter
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm tsx scripts/mock-ui-pack-e2e-filter.ts "$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "mock-ui-pack-e2e filter: $EVENT_NAME always runs the job"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-mechanism-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.filter.outputs.run == 'true'
        run: pnpm --filter @project-vault/web-host exec playwright install --with-deps chromium

      - name: Pack, compose, build the composed image, boot the stack, run the mechanism e2e
        if: steps.filter.outputs.run == 'true'
        # pipefail: a bare `| tee` would report tee's exit status and turn a failed e2e green. The raw
        # copy lives outside the workspace: it holds the `::add-mask::<secret>` lines that make the
        # runner mask the throwaway secrets in the live log, and those must never reach an artifact.
        run: |
          set -o pipefail
          pnpm tsx scripts/mock-ui-pack-e2e.ts 2>&1 | tee "$RUNNER_TEMP/mock-ui-pack-e2e.raw.log"

      - name: Strip the mask lines from the run log
        if: always() && steps.filter.outputs.run == 'true'
        run: sed '/^::add-mask::/d' "$RUNNER_TEMP/mock-ui-pack-e2e.raw.log" > mock-ui-pack-e2e.log

      - name: Upload the report and the redacted run log (failure only)
        if: failure() && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mock-ui-pack-e2e-report
          path: |
            apps/web/playwright-mechanism-output/html
            mock-ui-pack-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down any leftover stack (cancelled runs included)
        if: always()
        run: |
          docker ps -aq --filter "name=pv-mock-ui-pack-" | xargs -r docker rm -f
          docker network ls -q --filter "name=pv-mock-ui-pack-" | xargs -r docker network rm
          docker volume ls -q --filter "name=pv-mock-ui-pack-" | xargs -r docker volume rm

  # Story 68.3 AC-12: compose a small UI pack onto the REAL packed web-host in an isolated consumer
  # (fresh temp dir outside the repository, clean env, the packed tarballs only), then paraglide
  # compile, svelte-kit sync, svelte-check, the shipped unit tests, vite build, boot and HTTP/CSS
  # assertions, plus the negative cases and the Vite dev plugin. It has no path filter, so it runs
  # on every PR and every push to main. It needs no secret and no OIDC, so fork PRs run it too.
  # Required-check name once green on main: "Composition kit integration".
  composition-kit-integration:
    name: Composition kit integration
    runs-on: ubuntu-latest
    # Measured 2026-10-02 on a warm laptop: about 6 minutes for all five variants (npm install
    # about 2 minutes each, cold in CI). Story 68-15 adds a Chromium download and the session
    # injection cases (about 1 minute more in the compose variant). 45 minutes keeps the headroom
    # the original 30 gave (cold npm adds about 9 minutes).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Story 68-15: the injection cases that need a browser (hydration, the theme rune, client
      # navigation) run in a real Chromium against the composed host the job builds. Story 68-25
      # caches the browser download (DW-509 item 5); the install below still runs for the OS deps.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-composition-kit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for the injection browser cases (Story 68-15)
        run: pnpm --filter @project-vault/web-host exec playwright install --with-deps chromium

      - name: Composition kit composes a UI pack onto the packed web-host (AC-12, AC-13)
        env:
          COMPOSITION_KIT_INTEGRATION: '1'
        run: pnpm vitest run scripts/check-composition-kit-integration.test.ts

  # Story 66.20 (DW-406): a PR-time e2e signal. Epic 66 found 14 journeys broken by five product
  # changes that no PR run exercised, because e2e only ran in nightly.yml. These two jobs run the
  # FULL Playwright suite on a PR only when it touches a surface journeys assert on. The gate is a
  # job, not a workflow-level `paths:` filter (that would stop the required checks too). A job
  # skipped by `if:` reports as skipped, which counts as passing. The gate fails OPEN.
  #
  # ADVISORY: "PR e2e smoke" is deliberately NOT in branch protection's required list. Promoting it
  # is Nestor's decision (Story 66.20 Q1), made with the settings-preserving recipe in
  # ~/specs/gooverseas-lighthouse-merge-gate.md. A second push to the PR cancels a running smoke
  # job (this workflow's concurrency group); the trace upload below still runs on cancel.
  e2e-smoke-gate:
    name: PR e2e smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # Full history: the gate diffs the PR base against the merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the e2e smoke job runs
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/pr-e2e-smoke-gate.sh

  # Same boot as nightly.yml's `e2e` job (scripts/e2e-stack.sh: 12 per-run throwaway secrets, so no
  # repo secret is needed and fork PRs run it too). Measured on the green nightly 37059015596
  # (cold ubuntu-latest): 9 min total, 4.4 min of it the 92 tests, so the full suite fits the 12 min
  # budget and there is no journey subset to drift. timeout-minutes is 3x measured, rounded.
  e2e-smoke:
    name: PR e2e smoke
    needs: e2e-smoke-gate
    if: needs.e2e-smoke-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright's global-setup.ts runs on the host and imports @project-vault/shared (needs dist/).
      - name: Build workspace packages
        run: pnpm turbo build

      # GOTCHA: never run the compose up command for this stack directly; without the script's
      # throwaway secrets compose falls back to dev literals and the api dies under NODE_ENV=production.
      - name: Start the full stack (db, migrate, api, web)
        timeout-minutes: 15
        run: ./scripts/e2e-stack.sh up

      - name: Wait for API readiness
        run: ./scripts/e2e-stack.sh wait

      - name: Install Playwright browsers
        run: pnpm --filter @project-vault/web-host exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        timeout-minutes: 15
        run: E2E_CONFIRM_DB_RESET=true pnpm --filter @project-vault/web-host test:e2e

      # Also on cancel (a newer push or a timeout), so traces survive; run_attempt keeps a re-run
      # from colliding on the artifact name.
      - name: Upload Playwright report + traces (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/e2e/test-results/
          retention-days: 14
