name: Base Image Refresh

# Story 64.4 (Option B) / 64.6: proposes ONE reviewed PR whenever upstream publishes a new
# node:24-alpine or postgres:16-alpine build (the families listed by `refresh-base-image.sh images`),
# so OS-level fixes reach our images in days. Each pin stays a bare `FROM <image>@sha256:` digest
# (Sonar S8431-clean); Dependabot's docker ecosystem cannot follow a tag-less digest, hence this job.
#
# GITHUB_TOKEN trap: a PR opened (or a branch pushed) with GITHUB_TOKEN does NOT trigger
# `pull_request`/`push` workflows, so CI, the Story 64.3 PR image scan and the Docker Build jobs
# would never run on the refresh PR. ci.yml therefore has `workflow_dispatch`, and this job runs
# `gh workflow run ci.yml --ref <refresh branch>` after pushing (dispatch is exempt from the
# no-recursion rule). The results attach to the branch head SHA and show on the PR.
#
# A maintainer reviews and merges the gated PR by hand. Contract:
# scripts/check-base-image-refresh-workflow.test.ts. Logic: scripts/refresh-base-image.sh.

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: base-image-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh base image digests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open/update the PR and apply the label
      actions: write # `gh workflow run ci.yml` (dispatch gates the PR, see header)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: chore/base-image-refresh
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One row per image family whose upstream digest differs from the pinned one:
      # "<image> <old> <new>" in $RUNNER_TEMP/changes.txt. Unchanged families are left untouched.
      - name: Resolve current and upstream digests
        id: digests
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/changes.txt"
          for IMG in $(scripts/refresh-base-image.sh images); do
            OLD=$(scripts/refresh-base-image.sh current --image "$IMG")
            NEW=$(scripts/refresh-base-image.sh resolve --image "$IMG")
            echo "${IMG} pinned:   ${OLD}"
            echo "${IMG} upstream: ${NEW}"
            if [[ "$OLD" == "$NEW" ]]; then
              echo "${IMG} base image digest is current; nothing to do."
            else
              echo "${IMG} ${OLD} ${NEW}" >> "$RUNNER_TEMP/changes.txt"
            fi
          done
          if [[ -s "$RUNNER_TEMP/changes.txt" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "images=$(cut -d' ' -f1 "$RUNNER_TEMP/changes.txt" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          else
            echo "Every base image digest is current; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Registry-rollback sanity check: fails the job if any new image ships an older libssl3
      # than the pinned one on either architecture. The markdown tables go into the PR body.
      - name: Verify the new images are not a rollback
        if: steps.digests.outputs.changed == 'true'
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/versions.md"
          while read -r IMG OLD NEW; do
            {
              echo "#### ${IMG}"
              echo
              scripts/refresh-base-image.sh verify --image "$IMG" "$OLD" "$NEW"
              echo
            } | tee -a "$RUNNER_TEMP/versions.md"
          done < "$RUNNER_TEMP/changes.txt"

      - name: Rewrite FROM lines and push the refresh branch
        id: push
        if: steps.digests.outputs.changed == 'true'
        env:
          IMAGES: ${{ steps.digests.outputs.images }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" "origin/${DEFAULT_BRANCH}"
          : > "$RUNNER_TEMP/rewrites.txt"
          while read -r IMG OLD NEW; do
            scripts/refresh-base-image.sh rewrite --image "$IMG" "$NEW" | tee -a "$RUNNER_TEMP/rewrites.txt"
          done < "$RUNNER_TEMP/changes.txt"
          git add apps/api/Dockerfile apps/web/Dockerfile Dockerfile.ci deploy/fly/db/Dockerfile
          # Idempotent: if the existing refresh branch already carries exactly this change, leave
          # it (and its CI run) alone instead of force-pushing an identical tree.
          if git fetch --no-tags origin "$BRANCH" 2>/dev/null \
            && git diff --quiet --cached "origin/${BRANCH}" -- apps/api/Dockerfile apps/web/Dockerfile Dockerfile.ci deploy/fly/db/Dockerfile \
            && [[ -z "$(git diff --name-only "origin/${DEFAULT_BRANCH}" "origin/${BRANCH}" | grep -v -E '^(apps/api/Dockerfile|apps/web/Dockerfile|Dockerfile\.ci|deploy/fly/db/Dockerfile)$' || true)" ]]; then
            echo "Refresh branch already up to date."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(docker): refresh base image digests (${IMAGES})" \
            -m "Bump the digest pinned for: ${IMAGES}. Only the FROM lines of those images change."
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh PR
        id: pr
        if: steps.digests.outputs.changed == 'true'
        env:
          IMAGES: ${{ steps.digests.outputs.images }}
        run: |
          set -euo pipefail
          {
            echo "Automated base image refresh for: ${IMAGES} (Stories 64.4, 64.6)."
            echo
            while read -r IMG OLD NEW; do
              echo "- \`${IMG}\`: old \`${OLD}\`, new \`${NEW}\`"
            done < "$RUNNER_TEMP/changes.txt"
            echo
            cat "$RUNNER_TEMP/versions.md"
            echo
            echo "Rewrites (only the refreshed images' \`FROM\` lines change, each image family in lockstep):"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/rewrites.txt"
            echo
            echo "Merge by hand after review. A PR opened by GITHUB_TOKEN does not trigger \`pull_request\` workflows, so this job"
            echo "dispatches \`ci.yml\` on the branch: review the checks on the head commit (image scan, Docker Build,"
            echo "lockstep guard) before merging."
          } > "$RUNNER_TEMP/body.md"
          TITLE="chore(docker): refresh base image digests (${IMAGES})"
          gh label create base-image --color 0e8a16 --description "Automated base image refresh" || true
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$NUMBER" ]]; then
            echo "Updating existing PR #${NUMBER}"
            gh api -X PATCH "repos/${GH_REPO}/pulls/${NUMBER}" -f title="$TITLE" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" --label base-image
          fi

      - name: Dispatch CI on the refresh branch
        if: steps.digests.outputs.changed == 'true'
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -euo pipefail
          # Recovery: when the branch was already up to date, still dispatch if no CI run exists on
          # its head commit (e.g. the dispatch in a previous run failed), so the PR is never ungated.
          if [[ "$PUSHED" != "true" ]]; then
            SHA=$(gh api "repos/${GH_REPO}/branches/${BRANCH}" --jq .commit.sha)
            RUNS=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --json headSha --jq "[.[] | select(.headSha == \"${SHA}\")] | length")
            if [[ "$RUNS" -gt 0 ]]; then
              echo "CI already dispatched for ${SHA}."
              exit 0
            fi
          fi
          gh workflow run ci.yml --ref "$BRANCH"
