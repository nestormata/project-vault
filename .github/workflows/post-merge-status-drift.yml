name: Post-Merge Status Drift

# Story 1-17: catches a story whose PR merged to main while its sprint-status.yaml entry never
# advanced to "done" (the Story 14.8 drift class). Runs on every push to main — this project's
# only path onto main is a merged PR (see .claude/skills/pick-story/SKILL.md B2/C0/C5/C6) — rather
# than a nightly cron, so the drift is caught within seconds, not up to 24h later (see story ADR).
# Deliberately NOT added to Makefile's `ci` target or ci.yml (AC-6): this check only makes sense
# against main's own post-merge history, never a pre-merge feature branch (whose own history won't
# yet contain the merge commit for its own not-yet-merged PR).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-check:
    name: Check Post-Merge Status Drift
    runs-on: ubuntu-latest
    # Fires on every push to main (not nightly), so an unbounded default (GitHub's 360-minute
    # ceiling) could tie up a runner for hours on a hang (e.g. a pnpm install network stall).
    # Matches ci.yml's quality-gates job, which has the same checkout+setup+install+script shape.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # AC-5: full history is required — a shallow clone would silently under-report drift by
          # missing older merge commits (a false-negative "all clear"), the more dangerous failure
          # direction for a drift detector. If this is ever accidentally removed, the job will not
          # crash — it will just silently scan a truncated history and may miss older drift.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run post-merge status drift check
        run: pnpm check-post-merge-status-drift

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [drift-check]
    if: failure()
    # secrets.* isn't allowed directly in step `if:` expressions, so surface it via
    # job-level env first (env.* is allowed there).
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # Skip (not fail) when the webhook isn't configured — e.g. forks or repos that
      # haven't set up Slack yet — so an unrelated missing secret doesn't itself show
      # up as a failing job on every drift-check failure.
      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v3
        with:
          payload: |
            {
              "text": "Post-Merge Status Drift check failed for ${{ github.repository }} on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Post-Merge Status Drift Check Failed*\n*Repo:* ${{ github.repository }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
