name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    # Derived from the postgres: service block below — keep in sync if it changes.
    env:
      SUPERUSER_DATABASE_URL: postgresql://postgres:password@localhost:5432/project_vault
      VAULT_APP_DATABASE_URL: postgresql://vault_app:dev-only-change-in-prod@localhost:5432/project_vault
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: project_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Provision local test admin role credential
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE vault_admin PASSWORD 'password'"

      - name: Run Stryker mutation tests
        run: pnpm stryker run
        env:
          # Must use vault_app, not postgres — the postgres superuser bypasses RLS
          # entirely, which would make the RLS isolation tests pass even if policies
          # were broken or missing.
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}
          ADMIN_DATABASE_URL: postgresql://vault_admin:password@localhost:5432/project_vault

  flaky-test-repeat:
    name: Flaky Test Repeat Run
    runs-on: ubuntu-latest
    # The full `pnpm turbo test` suite takes ~20-25 minutes on its own (see the Quality
    # Gates job's "Test (with coverage)" step in ci.yml); 5 back-to-back runs need well
    # over 30 minutes end to end. 180 gives headroom without hitting the platform's
    # 360-minute job ceiling.
    timeout-minutes: 180
    # Rare, timing-dependent flakes (e.g. one bad run in ~6-8) are invisible to a single CI
    # run and to a single local `make ci` — a green run says nothing about a bug that only
    # shows up occasionally. Running the suite several times back-to-back turns "maybe
    # catches it" into "almost certainly catches it" before it lands on main. See the
    # register rate-limit fix and the mfa-login/mfa-enrollment cross-file investigation on
    # story 3-4 for the failures this job exists to catch early.
    env:
      SUPERUSER_DATABASE_URL: postgresql://postgres:password@localhost:5432/project_vault
      VAULT_APP_DATABASE_URL: postgresql://vault_app:dev-only-change-in-prod@localhost:5432/project_vault
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: project_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build

      - name: Test (5x back-to-back)
        run: |
          for i in $(seq 1 5); do
            echo "=== flaky-test-repeat: run $i/5 ==="
            # Reset to a freshly-migrated, empty database before each iteration. Without this,
            # self-registration flows across the whole suite accumulate organizations/users
            # unboundedly over the 5 runs — which both breaks tests that assume a small/bounded
            # count (e.g. Story 9.2 AC-8/AC-10's org limit and slug-collision-retry checks) and
            # makes each successive run dramatically slower (observed: run1 api:test ~20min,
            # run2 ~40min, run3 ~60min against the same ever-growing database). Dropping and
            # recreating `public` (app tables) and `drizzle` (migration bookkeeping) reproduces
            # the same fresh-DB starting state every normal single CI run gets for free from its
            # own dedicated postgres service container.
            psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c 'DROP SCHEMA IF EXISTS drizzle CASCADE; DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
            DATABASE_URL="$SUPERUSER_DATABASE_URL" pnpm db:migrate
            psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE vault_admin PASSWORD 'password'"
            pnpm turbo test --force
          done
        env:
          # SUPERUSER_DATABASE_URL is already set at the job level and inherited here —
          # only the override for the test run itself (vault_app, not postgres) is needed.
          DATABASE_URL: ${{ env.VAULT_APP_DATABASE_URL }}
          ADMIN_DATABASE_URL: postgresql://vault_admin:password@localhost:5432/project_vault

  trivy-image:
    name: Trivy Docker Image Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A hung image pull or DB download must not burn the 6-hour default (Story 64.3).
    timeout-minutes: 20
    # Story 64.3 AC-1: one matrix leg per shipped image, with fail-fast disabled, so a
    # finding in one image never skips (masks) the other's scan — the job still ends failed when
    # any leg fails. Chosen over two sequential steps with `if: !cancelled()` because the legs
    # also build in parallel, and each image gets its own red/green check in the run summary.
    # Never `continue-on-error` here: that would turn a real finding into a green job.
    # `migrate` is a shipped image too (container-publish.yml gates it at release, and ci.yml's
    # scan of it is advisory on pushes to main), so nightly is its gate on main as well: without
    # this leg a new upstream CVE in it would first block a release instead of turning a nightly red.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
            target: runner
          - name: migrate
            file: apps/api/Dockerfile
            target: migrate
          - name: web
            file: apps/web/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        # An explicit --target per leg, matching container-publish.yml's published images. Without
        # it, docker build produces the Dockerfile's default (last) stage -- for the API that is
        # the `migrate` leaf stage since Story 9.10 -- instead of the api runner that actually
        # ships (same bug ci.yml's Docker Build job had for its own size check). Deliberately
        # uncached: nightly is where apk/base-image drift must show.
        env:
          DOCKERFILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
          IMAGE_NAME: ${{ matrix.name }}
        run: docker build -f "$DOCKERFILE" --target "$TARGET" -t "project-vault-${IMAGE_NAME}:nightly" .

      - name: Run Trivy scan on ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: project-vault-${{ matrix.name }}:nightly
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Story 64.3 AC-2: honour the same time-boxed suppressions as ci.yml's scans.
          trivyignores: .trivyignore

  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    # A full browser E2E suite shares the same cost/flakiness profile as this job's siblings
    # (mutation/flaky-test-repeat/trivy-image): browser binary download, real navigation/network
    # timing, a full docker-compose stack boot — classic sources of PR-blocking flakiness unrelated
    # to a given PR's actual diff. Story 10-1 (AC-I5) deliberately runs this here, not as a
    # blocking ci.yml step; ci.yml's Quality Gates job is unmodified by this story.
    # Story 66.1 AC-10: 45 minutes, so a run with many failing, retried journeys still reports.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright's own global-setup.ts (run on the HOST by `test:e2e`, not inside a container)
      # calls resetDatabase() -> guarded-migrate.ts, which imports @project-vault/shared -- that
      # needs a built dist/ on the host regardless of docker-compose building it separately inside
      # the api/migrate containers below. Matches the "Build workspace packages" step the
      # flaky-test-repeat and mutation jobs already run before touching packages/db's scripts.
      - name: Build workspace packages
        run: pnpm turbo build

      # Story 10-1 Dev Notes: VAULT_ALLOW_REMOTE_INIT=true is applied ONLY via
      # docker-compose.e2e.yml's override, scoped to this job — never the base docker-compose.yml
      # (that would weaken every developer's default local bootstrap-token protection).
      #
      # Story 66.1: the api runs under NODE_ENV=production, and since Story 1-24 env.ts rejects the
      # base compose file's dev-default secrets. scripts/e2e-stack.sh generates 12 per-run
      # throwaway secrets (::add-mask::ed, never written to $GITHUB_ENV, never printed) that live
      # only inside this step's process, then brings the stack up and dumps `ps -a` + the
      # migrate/admin-provision/api logs if `up` fails. The build runs inside `up`, so it never eats
      # into the readiness budget below.
      # GOTCHA: never add a later step that runs `docker compose … up` for this stack directly —
      # without the script's secrets compose falls back to the dev literals and the recreated api
      # dies at boot. This job must never reference secrets.* either (no repo secret is needed).
      - name: Start the full stack (db, migrate, api, web)
        timeout-minutes: 15
        run: ./scripts/e2e-stack.sh up

      # Polls /health, not /ready: /ready reports 503 "uninitialized" until the vault is
      # initialized, and vault init only happens inside Playwright's own global-setup.ts (a later
      # step). /health only asserts basic API/DB liveness, which is what this step needs to confirm
      # before handing off to global-setup.ts's own readiness+init sequence. On a timeout, or as
      # soon as the api container exits, the script prints `ps -a` + the migrate/admin-provision/api
      # logs before failing (Story 66.1 AC-4), and on success the last 20 api log lines.
      - name: Wait for API readiness
        run: ./scripts/e2e-stack.sh wait

      - name: Install Playwright browsers
        run: pnpm --filter @project-vault/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        timeout-minutes: 25
        # E2E_CONFIRM_DB_RESET is global-setup.ts's explicit opt-in that this run's target
        # database is understood to be disposable (see apps/web/e2e/global-setup.ts's
        # assertResetIsSafe() — a bare, ungated DB reset would be too dangerous to run
        # unconditionally against whatever superuserDatabaseUrl() resolves to).
        run: E2E_CONFIRM_DB_RESET=true pnpm --filter @project-vault/web test:e2e

      # Story 66.1 AC-10: also on cancel (a job timeout), so traces survive a slow failing run; the
      # run_attempt suffix keeps "Re-run failed jobs" from colliding on the artifact name. Traces
      # can hold cookies/JWTs signed with this run's throwaway secrets, worthless once it ends.
      - name: Upload Playwright report + traces (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/e2e/test-results/
          retention-days: 30

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [mutation, flaky-test-repeat, trivy-image, e2e]
    if: failure()
    # secrets.* isn't allowed directly in step `if:` expressions, so surface it via
    # job-level env first (env.* is allowed there).
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # Skip (not fail) when the webhook isn't configured — e.g. forks or repos that
      # haven't set up Slack yet — so an unrelated missing secret doesn't itself show
      # up as a failing job on every nightly failure.
      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload: |
            {
              "text": "Nightly CI failed for ${{ github.repository }} on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Nightly CI Failed*\n*Repo:* ${{ github.repository }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
