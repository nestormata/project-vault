name: Fly Demo Bootstrap

# One-time (or re-run-if-something-changed) provisioning, run entirely in CI so it uses
# the exact same secret values already stored in this repo (FLY_DEMO_PG_SUPERUSER_PASSWORD
# etc.) instead of requiring flyctl locally and re-typing values GitHub secrets can't hand
# back to you once set. See scripts/fly-setup.sh for what each step does.
on:
  workflow_dispatch:
    inputs:
      fly_org:
        description: Fly.io org slug (fly orgs list)
        required: true
        type: string
      release_tag:
        description: vMAJOR.MINOR.PATCH release tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create Fly apps, set secrets, deploy, seed
    runs-on: ubuntu-latest
    # Story 43.28: one group for bootstrap, deploy and reset, so the scheduled reset can never
    # wipe the schema in the middle of a deploy or bootstrap. Never cancel a running one.
    concurrency:
      group: fly-demo-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ inputs.fly_org }}
      ADMIN_PG_PASSWORD: ${{ secrets.FLY_DEMO_PG_SUPERUSER_PASSWORD }}
      VAULT_APP_PASSWORD: ${{ secrets.FLY_DEMO_VAULT_APP_PASSWORD }}
      VAULT_ADMIN_PASSWORD: ${{ secrets.FLY_DEMO_VAULT_ADMIN_PASSWORD }}
      DEMO_VAULT_PASSPHRASE: ${{ secrets.FLY_DEMO_VAULT_PASSPHRASE }}
      DEMO_LOGIN_EMAIL: ${{ secrets.FLY_DEMO_LOGIN_EMAIL }}
      DEMO_LOGIN_PASSWORD: ${{ secrets.FLY_DEMO_LOGIN_PASSWORD }}
      VAULT_BOOTSTRAP_TOKEN: ${{ secrets.FLY_DEMO_VAULT_BOOTSTRAP_TOKEN }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH without leading zeroes, received '$RELEASE_TAG'" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Release tag '$RELEASE_TAG' does not exist on origin" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Story 43.28: no `version:` input. The action reads the CHECKED-OUT release's
      # package.json `packageManager`; a pinned version here fails with "Multiple versions of
      # pnpm specified" whenever main's pnpm differs from the release's (scheduled reset, or a
      # dispatch of an older tag), as in run 36823249947.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # db:migrate/db:seed:demo run from source via tsx but import built output (dist/)
      # from their workspace deps.
      - name: Build shared/crypto/db packages
        run: pnpm --filter @project-vault/shared --filter @project-vault/crypto --filter @project-vault/db build

      - name: Install psql + jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client jq

      - name: Create apps, volume, secrets, deploy db
        run: ./scripts/fly-setup.sh
        env:
          # Story 43.16: the internal CA mints the TLS leaves / the per-run operator certificate.
          # Scoped to this step only — never to a deploy step (docs/runbooks/fly-internal-tls.md).
          FLY_INTERNAL_CA_CERT_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_CERT_B64 }}
          FLY_INTERNAL_CA_KEY_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_KEY_B64 }}

      # Story 43.28: migrate (and sync the vault_app/vault_admin passwords) BEFORE the api
      # deploys, so its first boot sees the real passwords and the full schema. fly-setup.sh only
      # staged the api secrets, so the old api has not been restarted. A destructive pending
      # migration is refused (guarded-migrate) and fails the bootstrap before the api deploys.
      - name: Run pending migrations
        run: ./scripts/fly-migrate.sh
        env:
          ADMIN_PG_PASSWORD: ${{ secrets.FLY_DEMO_PG_SUPERUSER_PASSWORD }}
          VAULT_APP_PASSWORD: ${{ secrets.FLY_DEMO_VAULT_APP_PASSWORD }}
          VAULT_ADMIN_PASSWORD: ${{ secrets.FLY_DEMO_VAULT_ADMIN_PASSWORD }}
          # Story 43.16: the internal CA mints the per-run operator certificate.
          # Scoped to this step only — never to a deploy step (docs/runbooks/fly-internal-tls.md).
          FLY_INTERNAL_CA_CERT_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_CERT_B64 }}
          FLY_INTERNAL_CA_KEY_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_KEY_B64 }}

      - name: Deploy api
        run: flyctl deploy -c fly.api.toml -a project-vault-demo-api --ha=false --remote-only --build-arg RELEASE_VERSION=${{ steps.release.outputs.version }}

      # Story 43.28 AC-4: `flyctl deploy` can leave a machine Fly already stopped (max restarts)
      # stopped while reporting success. No web URL yet: web deploys next, and the reset below
      # waits for /ready.
      - name: Ensure api machines are started
        run: ./scripts/fly-ensure-started.sh project-vault-demo-api

      - name: Deploy web
        run: flyctl deploy -c fly.web.toml -a project-vault-demo-web --ha=false --remote-only --build-arg RELEASE_VERSION=${{ steps.release.outputs.version }}

      - name: First reset (migrate + seed + vault init/unseal)
        run: ./scripts/fly-reset.sh
        env:
          # Story 43.16: the internal CA mints the TLS leaves / the per-run operator certificate.
          # Scoped to this step only — never to a deploy step (docs/runbooks/fly-internal-tls.md).
          FLY_INTERNAL_CA_CERT_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_CERT_B64 }}
          FLY_INTERNAL_CA_KEY_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_KEY_B64 }}
