name: Web-host release

# Story 68.2 AC-10: publishes @project-vault/web-host (Project Vault's web application source, see
# docs/web-host-package.md) to npm from a PV release tag. It fires on the same vMAJOR.MINOR.PATCH
# tag as container-publish.yml and cli-release.yml, so the web source, its version and the API
# image tag in its compatibility manifest are one commit (design §11). Modelled on
# extension-api-release.yml:
# - it triggers on `v[0-9]*` tags, the same pattern as the npm-publish environment's tag policy and
#   the "Protect PV release tags" ruleset (not `v*`, which also matches the force-moved
#   vault-action-v1 tag and would start runs in the shared concurrency group); `validate` then
#   accepts only full vMAJOR.MINOR.PATCH tags, with the exact regex of container-publish.yml and
#   cli-release.yml: prereleases are refused (Story 68.12, D2);
# - a tag push starts this workflow at H2, before the GitHub Release exists. Each upload job first
#   requires the published Release and a green container-publish run for the same commit (Story
#   68.12, D1), so an early approval cannot publish a web-host whose API image does not exist. On a
#   dry run that gate only reports;
# - both jobs check out `github.sha` (the commit the provenance attests), and fail before the upload
#   if the tag has moved since the run started. The release gate and the tag-moved check are
#   scripts/web-host-release-gate.sh and scripts/web-host-release-tag-moved.sh, run from that
#   checkout (so after it), taking every input from env;
# - `publish` runs in the npm-publish environment (required reviewer) with OIDC Trusted Publishing
#   and npm provenance. There is no NPM_TOKEN. Every publish goes to the `next` dist-tag; a
#   maintainer promotes a verified version to `latest` separately;
# - npm versions are immutable: never --force, never unpublish. Re-running after a successful
#   publish fails the "not already on npm" gate by design (check `npm view @project-vault/web-host
#   versions` before treating that as a bug);
# - a workflow_dispatch `dry_run` (dispatched on a tag ref) runs every gate except the upload, in
#   its own concurrency group so a rehearsal never queues behind or cancels a real release;
# - both Node legs verify, only the Node 24 leg uploads;
# - Story 68.3: `publish-kit` runs BEFORE `publish` and publishes @project-vault/composition-kit
#   (MIT, its own semver in packages/composition-kit/package.json, same OIDC flow, always `next`)
#   unless that exact kit version is already on npm. web-host's compatibility manifest names the kit
#   version it was built with, so `publish` refuses to upload a web-host whose kit is not on npm.
# Maintainer-only prerequisites, all done (Story 68.12 steps 2-4, 2026-10-03): the npm bootstrap
# version, the npm trusted publisher for @project-vault/web-host (this workflow file, environment
# npm-publish), the npm-publish environment's tag policy `v[0-9]*` and the ruleset "Protect PV
# release tags" restricting creation of `refs/tags/v[0-9]*`. Both use `v[0-9]*`, not `v*`, so that
# vault-action-v* and extension-api-v* tags stay outside them. Story 68-13 owns the same steps for
# @project-vault/composition-kit. The release-day runbook is docs/releasing.md section 9.

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every release gate at the dispatched tag without uploading a package'
        required: true
        default: false
        type: boolean

concurrency:
  # `inputs.dry_run` is null on a tag push, so only an explicit dry run gets the separate group.
  group: ${{ inputs.dry_run == true && format('web-host-release-dry-run-{0}', github.ref) || 'web-host-release' }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.tagcheck.outputs.should_release }}
      version: ${{ steps.tagcheck.outputs.version }}
    steps:
      - name: Check whether this is a full release tag
        id: tagcheck
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            VERSION="${TAG#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Eligible release tag: $TAG (version $VERSION)"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Skipping '$TAG': it is not a full vMAJOR.MINOR.PATCH release tag (prereleases are not published)."
          fi

  publish-kit:
    name: Verify and publish the composition kit (Node ${{ matrix.node-version }})
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Story 68.12 AC-4 (D1): the tag push runs at H2, before the Release. Never upload a version
      # whose GitHub Release (H3) and API image (container-publish) do not exist for this commit.
      - name: Require the published GitHub Release and a green container-publish for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ONLY: ${{ inputs.dry_run == true && '1' || '0' }}
        run: ./scripts/web-host-release-gate.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the kit is MIT, imports no AGPL code and has permissive dependencies only
        run: pnpm check-composition-kit-boundary

      - name: Typecheck, test and build the kit
        run: |
          pnpm --filter @project-vault/composition-kit typecheck
          pnpm --filter @project-vault/composition-kit test
          pnpm --filter @project-vault/composition-kit build

      - name: Read the kit version
        id: kit
        shell: bash
        run: echo "version=$(node -p "require('./packages/composition-kit/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify version triangle
        run: pnpm exec tsx scripts/check-release-version-triangle.ts composition-kit --tag "${{ steps.kit.outputs.version }}"

      # The kit has its own semver: a PV release that does not change it must not re-publish it.
      - name: Check whether this kit version is already on npm
        id: npm
        shell: bash
        run: |
          set -uo pipefail
          KIT_VERSION="${{ steps.kit.outputs.version }}"
          # GitHub starts `shell: bash` with -e and `set -uo` does not clear it: a bare failing
          # substitution would abort here, silently, on the normal "not on npm yet" E404.
          OUTPUT="$(npm view "@project-vault/composition-kit@${KIT_VERSION}" version 2>&1)" && STATUS=0 || STATUS=$?
          if [[ $STATUS -eq 0 ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@project-vault/composition-kit@${KIT_VERSION} is already on npm; nothing to publish."
          elif grep -q 'E404' <<< "$OUTPUT"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@project-vault/composition-kit@${KIT_VERSION} is not on npm yet."
          else
            echo "FATAL: could not confirm whether ${KIT_VERSION} is published:" >&2
            echo "$OUTPUT" >&2
            exit 1
          fi

      - name: Inspect the exact npm tarball
        working-directory: packages/composition-kit
        run: npm pack --dry-run --json

      # Both legs verify; only the Node 24 leg uploads, so one tag publishes once (extension-api rule).
      - name: Dry-run publish the kit (no registry upload)
        if: inputs.dry_run == true && matrix.node-version == 24 && steps.npm.outputs.published != 'true'
        working-directory: packages/composition-kit
        run: npm publish --dry-run --provenance --access public --tag next

      # Story 68.12 AC-4: the job may start days after the tag push (approval wait), and the ruleset
      # restricts only tag creation. Never publish if the tag no longer names the attested commit.
      - name: Fail if the tag moved
        if: inputs.dry_run != true
        shell: bash
        run: ./scripts/web-host-release-tag-moved.sh

      - name: Publish the kit to npm next with OIDC provenance
        if: inputs.dry_run != true && matrix.node-version == 24 && steps.npm.outputs.published != 'true'
        working-directory: packages/composition-kit
        run: |
          set -o pipefail
          if ! npm publish --provenance --access public --tag next; then
            echo "ERROR: npm publish failed for the composition kit. Versions are immutable; never --force or unpublish." >&2
            exit 1
          fi

  publish:
    name: Verify and publish (Node ${{ matrix.node-version }})
    needs: [validate, publish-kit]
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # 24 is the engines.node floor; 26 is the current release line.
        node-version: [24, 26]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Story 68.12 AC-4 (D1): the tag push runs at H2, before the Release. Never upload a version
      # whose GitHub Release (H3) and API image (container-publish) do not exist for this commit.
      - name: Require the published GitHub Release and a green container-publish for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ONLY: ${{ inputs.dry_run == true && '1' || '0' }}
        run: ./scripts/web-host-release-gate.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.28.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the paraglide plugin pin
        run: pnpm vitest run scripts/check-paraglide-plugin-pinned.test.ts

      # Registry-only: a release must build against the published @project-vault/extension-api. PR
      # and local runs may fall back to a workspace tarball while a bumped version is unpublished;
      # the release never does (Nestor 2026-10-02, asserted by check-web-host-release-workflow).
      - name: Out-of-monorepo consumer fixture
        env:
          WEB_HOST_FIXTURE: '1'
          WEB_HOST_FIXTURE_REGISTRY_ONLY: '1'
        run: pnpm vitest run scripts/check-web-host-consumer-fixture.test.ts

      # Packs at the release version (lockfile drift fails the pack) and asserts the tarball rules on
      # that exact staged directory, which the publish steps below then upload.
      - name: Pack at the release version and check the tarball
        env:
          WEB_HOST_PACK_VERSION: ${{ needs.validate.outputs.version }}
        run: pnpm vitest run scripts/check-web-host-tarball.test.ts

      - name: Verify version triangle
        run: pnpm exec tsx scripts/check-release-version-triangle.ts web-host --tag "$RELEASE_VERSION"

      # web-host's tuple names the kit version it was built with; publish-kit has already run, so a real
      # release must find that exact kit on npm (a dry run may name a kit that is not published yet).
      - name: Require the composition kit named by the compatibility manifest to be on npm
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          KIT_VERSION="$(node -p "require('./.web-host-pack/manifests/compatibility.json').kitVersion")"
          npm view "@project-vault/composition-kit@${KIT_VERSION}" version

      - name: Reject a version that is already on npm
        shell: bash
        run: |
          set -uo pipefail
          # Same -e trap as the kit step above: capture the failure instead of aborting on it.
          OUTPUT="$(npm view "@project-vault/web-host@${RELEASE_VERSION}" version 2>&1)" && STATUS=0 || STATUS=$?
          if [[ $STATUS -eq 0 ]]; then
            echo "FATAL: @project-vault/web-host@${RELEASE_VERSION} is already published. npm versions are immutable; cut a new PV release." >&2
            exit 1
          fi
          if ! grep -q 'E404' <<< "$OUTPUT"; then
            echo "FATAL: could not confirm that ${RELEASE_VERSION} is unpublished:" >&2
            echo "$OUTPUT" >&2
            exit 1
          fi
          echo "@project-vault/web-host@${RELEASE_VERSION} is not on npm yet."

      - name: Inspect the exact npm tarball
        working-directory: .web-host-pack
        run: npm pack --dry-run --json

      # Both legs verify; only the Node 24 leg uploads, so one tag publishes once (extension-api rule).
      - name: Dry-run publish (no registry upload)
        if: inputs.dry_run == true && matrix.node-version == 24
        working-directory: .web-host-pack
        run: npm publish --dry-run --provenance --access public --tag next

      # Story 68.12 AC-4: the job may start days after the tag push (approval wait), and the ruleset
      # restricts only tag creation. Never publish if the tag no longer names the attested commit.
      - name: Fail if the tag moved
        if: inputs.dry_run != true
        shell: bash
        run: ./scripts/web-host-release-tag-moved.sh

      - name: Publish to npm next with OIDC provenance
        if: inputs.dry_run != true && matrix.node-version == 24
        working-directory: .web-host-pack
        run: |
          set -o pipefail
          if ! npm publish --provenance --access public --tag next; then
            echo "ERROR: npm publish failed for ${RELEASE_VERSION}. Versions are immutable; never --force or unpublish." >&2
            exit 1
          fi
