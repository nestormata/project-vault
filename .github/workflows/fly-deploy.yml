name: Fly Demo Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH without leading zeroes, received '$TAG'" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            echo "Release tag '$TAG' does not exist on origin" >&2
            exit 1
          fi

          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy self-hosted demo (db/api/web) to Fly.io
    needs: prepare
    runs-on: ubuntu-latest
    # Story 43.28: one group for bootstrap, deploy and reset, so the scheduled reset can never
    # wipe the schema in the middle of a deploy or bootstrap. Never cancel a running one.
    concurrency:
      group: fly-demo-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # Story 43.28 follow-up: the release checkout above can predate scripts/fly-ensure-started.sh
      # (v1.3.0 and older), so dispatching an older tag from main would fail at the ensure steps.
      # The script only drives flyctl and curl, so it runs from this workflow's own commit.
      - name: Fetch workflow tooling
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/fly-tools"
          git show FETCH_HEAD:scripts/fly-ensure-started.sh >"$RUNNER_TEMP/fly-tools/fly-ensure-started.sh"
          chmod +x "$RUNNER_TEMP/fly-tools/fly-ensure-started.sh"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Story 43.28: no `version:` input. The action reads the CHECKED-OUT release's
      # package.json `packageManager`; a pinned version here fails with "Multiple versions of
      # pnpm specified" whenever main's pnpm differs from the release's (scheduled reset, or a
      # dispatch of an older tag), as in run 36823249947.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # db:migrate runs from source via tsx, but imports built output (dist/) from its
      # workspace deps, so those need building first — mirrors fly-reset.yml.
      - name: Build shared/crypto/db packages
        run: pnpm --filter @project-vault/shared --filter @project-vault/crypto --filter @project-vault/db build

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # jq: scripts/fly-ensure-started.sh parses `flyctl machine list --json` (Story 43.28).
      - name: Install psql + jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client jq

      # db rarely changes — deploy it too so a first-time bootstrap or a fly.db.toml /
      # deploy/fly/db edit still lands. Story 43.16: it builds deploy/fly/db/Dockerfile
      # (postgres:16-alpine + TLS 1.3 and client-certificate pg_hba), so it runs on Fly's
      # remote builder like api/web; it applies the DB_TLS_* secrets staged by
      # scripts/fly-internal-tls.sh, which is why db deploys before migrate/api/web.
      - name: Deploy db
        run: flyctl deploy -c fly.db.toml -a project-vault-demo-db --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Runs BEFORE deploying api so the new api code never boots against a schema it
      # doesn't recognize yet (this story's root cause: 16-4's migration merged, api
      # redeployed with code assuming the new column, but nothing had applied it to the
      # live demo DB — fly-reset.yml's nightly cron was the only thing that ever ran
      # migrations). Purely additive/backward-compatible migrations are safe to apply
      # while the OLD api version is still serving traffic against the DB; a genuinely
      # destructive migration is refused by guarded-migrate.ts (see scripts/fly-migrate.sh)
      # and fails this step — and the deploy — loudly instead of running unattended.
      - name: Run pending migrations
        run: ./scripts/fly-migrate.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ADMIN_PG_PASSWORD: ${{ secrets.FLY_DEMO_PG_SUPERUSER_PASSWORD }}
          VAULT_APP_PASSWORD: ${{ secrets.FLY_DEMO_VAULT_APP_PASSWORD }}
          VAULT_ADMIN_PASSWORD: ${{ secrets.FLY_DEMO_VAULT_ADMIN_PASSWORD }}
          # Story 43.16: the internal CA mints the TLS leaves / the per-run operator certificate.
          # Scoped to this step only — never to a deploy step (docs/runbooks/fly-internal-tls.md).
          FLY_INTERNAL_CA_CERT_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_CERT_B64 }}
          FLY_INTERNAL_CA_KEY_B64: ${{ secrets.FLY_DEMO_INTERNAL_CA_KEY_B64 }}

      - name: Deploy api
        run: flyctl deploy -c fly.api.toml -a project-vault-demo-api --ha=false --remote-only --build-arg RELEASE_VERSION=${{ needs.prepare.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Story 43.28 AC-4: start any api machine Fly left stopped (max restarts), which
      # `flyctl deploy` reports as a good state.
      - name: Ensure api machines are started
        run: $RUNNER_TEMP/fly-tools/fly-ensure-started.sh project-vault-demo-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy web
        run: flyctl deploy -c fly.web.toml -a project-vault-demo-web --ha=false --remote-only --build-arg RELEASE_VERSION=${{ needs.prepare.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Story 43.28 AC-4: a deploy must not go green over a down api. Waits (bounded) until
      # /ready, proxied through web, stops reporting api_unreachable (sealed is fine).
      - name: Ensure api is reachable through web
        run: $RUNNER_TEMP/fly-tools/fly-ensure-started.sh project-vault-demo-api https://project-vault-demo-web.fly.dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
