# CLA Assistant — required status check enforcing the Contributor License Agreement
# (see /CONTRIBUTING.md and /CLA.md).
#
# Tooling provenance (maintenance-rot safeguard — see story 14-0):
#   The originally popular free CLA bot, contributor-assistant/github-action, was archived
#   and made read-only on 2026-03-23. As of 2026-07-24, this workflow uses the actively
#   maintained fork rdkcentral/contributor-assistant_github-action (tag v2.7.0, last pushed
#   2026-06-13), pinned to an exact commit SHA per this repo's third-party-Action-pinning
#   preference for less-trusted forks. If you're reading this later and wondering "is this
#   still the right choice" — it was last verified on the date above; re-check maintenance
#   status (archived? stale?) before assuming it still is.
name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # rdkcentral/contributor-assistant_github-action, tag v2.7.0 (pinned to commit SHA,
        # not the floating tag — see provenance note above).
        uses: rdkcentral/contributor-assistant_github-action@2c505e3cbfadaa766a7dd6e00e9b22c26509c13c # v2.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v2.7.0 (the latest tag as of the provenance date above) bundles dependencies that
          # emit Node's DEP0040 (punycode) and DEP0169 (url.parse) deprecation warnings on
          # startup. These originate inside the action's own dist bundle, not this repo's code,
          # and there's no newer tag yet that resolves them upstream — silence them here so real
          # signal isn't buried in noise; revisit when a newer release lands.
          NODE_OPTIONS: "--no-deprecation"
        with:
          # CLA version 2 (2026-09-30). Signatures are stored per CLA version, so a signature
          # given to one version is never counted as agreement to another. version1 collected no
          # signatures before it was replaced. Bump this path whenever CLA.md's version changes.
          path-to-signatures: "signatures/version2/cla.json"
          # The action takes a fully qualified link to the document. It points at the immutable
          # `cla-v2` tag, so the link always shows exactly the version 2 text a contributor
          # signs, even after CLA.md on main changes. The tag is created on the commit that
          # merges CLA version 2; a future version 3 gets its own tag, signature path and link.
          path-to-document: "https://github.com/nestormata/project-vault/blob/cla-v2/CLA.md"
          # NOT "main": the action commits signature records directly to this branch, and the
          # action's own docs warn "branch should not be protected". This repo's `main` has
          # branch protection enabled (required PR reviews) — a direct push there would be
          # rejected, silently breaking signature persistence. Use a dedicated, unprotected
          # branch instead — `cla-signatures` (created 2026-07-24, orphan branch, unprotected)
          # holds one `signatures/versionN/cla.json` per CLA version; the action creates the
          # current version's file on the first signature and updates it in place after that.
          branch: "cla-signatures"
          # Exclude the repo owner and known bot accounts so they are never blocked by the
          # gate on their own PRs (see story 14-0 AC5 negative case). "Copilot" is the commit
          # author login used by the GitHub Copilot coding agent (copilot-swe-agent[bot]) —
          # it cannot sign a CLA on its own behalf.
          allowlist: "nestormata,dependabot[bot],dependabot-preview[bot],Copilot"
          # If the Action itself fails to run (e.g. a GitHub Actions outage), the required
          # status check for this job fails closed by default — GitHub reports a required
          # check as failing/missing rather than passing when the job that produces it
          # doesn't complete successfully.
          lock-pullrequest-aftermerge: true
