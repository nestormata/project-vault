name: Publish container images
# Names the tag on every run, so a manual recovery from `main` shows which tag it built. Display
# only: web-host-release.yml's Release gate does not trust run names (docs/releasing.md §9.2).
run-name: Publish container images ${{ inputs.tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish or recover
        required: true
        type: string

permissions: {}

# All runs share the aliases below, so releases and manual recoveries must finish in order.
concurrency:
  group: container-publish-aliases
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publication is only allowed from refs/heads/main" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH without leading zeroes, received '$TAG'" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            echo "Release tag '$TAG' does not exist on origin" >&2
            exit 1
          fi

          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-publish:
    name: Publish ${{ matrix.name }} image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
            target: runner
          # `migrate` is a minimal leaf stage (Story 64.3): a fresh node base carrying only
          # @project-vault/db's compiled migration runner, its production deps and pnpm. It is the
          # last stage and the only one with the release-version label — see apps/api/Dockerfile's
          # comment on why that label must not live in a stage the api build chain derives from.
          - name: migrate
            file: apps/api/Dockerfile
            target: migrate
          - name: web
            file: apps/web/Dockerfile
            target: runner
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing immutable release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE="${IMAGE_NAMESPACE}/${{ matrix.name }}:${VERSION}"
          if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
            echo "Immutable release tag already exists: $SOURCE" >&2
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=container-publish-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=container-publish-${{ matrix.name }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Story 9.10 AC-2: fails the run — before promote-aliases can create/move any alias tag —
      # if the pushed org.opencontainers.image.version label disagrees with the validated release
      # tag, or (for api, whose runtime actually reads RELEASE_VERSION) the image's baked runtime
      # value disagrees with it. Runs after "Attest image provenance" so a mismatch is caught
      # immediately after push, using the same digest just built.
      #
      # Uses `imagetools inspect --format '{{json .}}'` + jq rather than a Go-template field
      # reference because the JSON document's keys are lowercase (`.image`, `.config`) even though
      # the Go template exposes them capitalised (`.Image.Config`) — mixing the two casings makes
      # the jq silently read `null`. `.image` is the image config object for a single-platform ref
      # but a map keyed by platform for the multi-platform manifest list this workflow actually
      # publishes (`linux/amd64,linux/arm64`), so the jq below normalises both shapes and then
      # asserts EVERY real platform, not just the first — an arm64 image with the wrong identity
      # must not ride along on a correct amd64 one. `unknown/*` keys are skipped: `provenance`/
      # `sbom` add attestation manifests to the index that carry no image config. Config.Env is
      # read as a real JSON array rather than split on spaces (a value containing a space would
      # otherwise silently truncate).
      - name: Verify published image version matches the release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          SOURCE="${IMAGE_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"

          INSPECT_JSON=$(docker buildx imagetools inspect "$SOURCE" --format '{{json .}}')

          # One TSV row per real platform: <platform>\t<oci label>\t<baked RELEASE_VERSION>
          ROWS=$(jq -r '
            (if (.image | type) != "object" then {}
             elif (.image.config? != null) then { "single": .image }
             else .image end)
            | to_entries[]
            | select(.key | startswith("unknown/") | not)
            | [ .key,
                (.value.config.Labels["org.opencontainers.image.version"] // ""),
                ((.value.config.Env // [])
                  | map(select(startswith("RELEASE_VERSION=")))
                  | (.[0] // "")
                  | sub("^RELEASE_VERSION="; "")) ]
            | @tsv
          ' <<<"$INSPECT_JSON")

          if [[ -z "$ROWS" ]]; then
            echo "Cannot verify ${IMAGE_NAME}: 'imagetools inspect $SOURCE' returned no readable image config" >&2
            exit 1
          fi

          while IFS=$'\t' read -r PLATFORM LABEL_VERSION RUNTIME_VERSION; do
            [[ -n "$PLATFORM" ]] || continue

            if [[ "$LABEL_VERSION" != "$VERSION" ]]; then
              echo "Version mismatch for ${IMAGE_NAME} (${PLATFORM}): image label 'org.opencontainers.image.version' is '$LABEL_VERSION', expected '$VERSION' (release tag)" >&2
              exit 1
            fi

            # Only the api runtime image actually runs the app (ENV RELEASE_VERSION), so it is the
            # only image whose baked-in runtime value can be checked. Note the label check above
            # is necessary but not sufficient on its own: `build-push-action` applies
            # docker/metadata-action's `--label` on top of the Dockerfile's own
            # `LABEL ...=$RELEASE_VERSION`, so for migrate/web the label proves the pushed
            # metadata is right, while this Env assertion is what proves the build-arg itself
            # was wired through. See deferred DW-107 for closing that gap with a build smoke test.
            if [[ "$IMAGE_NAME" == "api" && "$RUNTIME_VERSION" != "$VERSION" ]]; then
              echo "Version mismatch for ${IMAGE_NAME} (${PLATFORM}): baked-in runtime RELEASE_VERSION is '$RUNTIME_VERSION', expected '$VERSION' (release tag)" >&2
              exit 1
            fi

            echo "Verified ${IMAGE_NAME} (${PLATFORM}): version '$VERSION'"
          done <<<"$ROWS"

      # Story 64.3 AC-4: release vulnerability gate. Scans the exact bytes just pushed
      # (`<image>@<digest>`) for BOTH published platforms with the same settings as ci.yml's PR
      # scan and nightly.yml. Any fixable HIGH/CRITICAL finding fails build-publish, and because
      # promote-aliases `needs: build-publish` (and requires its success), the semver and
      # `latest` aliases are NOT moved onto a vulnerable image. The arm64 scan runs even when the
      # amd64 one fails (`!cancelled()`), so one finding never hides the other platform's; both
      # only run once the push itself succeeded, so they never scan an empty `name@` reference.
      #
      # KNOWN LIMIT (documented in docs/container-images.md, "Release vulnerability gate"): the
      # immutable `X.Y.Z` and `sha-<commit>` tags are already pushed by the time this runs, so a
      # failed gate leaves a published but un-promoted `X.Y.Z` image behind. Recovery: fix the vulnerability, then cut
      # `vX.Y.(Z+1)`. Re-running the same tag through workflow_dispatch is refused by the
      # "Reject existing immutable release tag" step above, by design. Rejected alternative:
      # scanning before the push would need an extra single-arch `load` build per platform,
      # doubling release build time, and would still not scan the exact pushed bytes.
      - name: Scan published image for vulnerabilities (linux/amd64)
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action v0.36.0 has no platform input, but its entrypoint runs `trivy image`
          # with the step's env, so Trivy's own TRIVY_PLATFORM selects the manifest-list entry.
          TRIVY_PLATFORM: linux/amd64
          # The digest was pushed by buildx's docker-container driver and never loaded into the
          # local daemon: read it straight from the registry.
          TRIVY_IMAGE_SRC: remote
          # Registry auth comes from the Docker config the "Log in to GHCR" step wrote, which is
          # scoped to ghcr.io. TRIVY_USERNAME/TRIVY_PASSWORD are deliberately not set: Trivy would
          # offer them to every registry it contacts, including its vulnerability-DB mirrors.
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan published image for vulnerabilities (linux/arm64)
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action v0.36.0 has no platform input, but its entrypoint runs `trivy image`
          # with the step's env, so Trivy's own TRIVY_PLATFORM selects the manifest-list entry.
          TRIVY_PLATFORM: linux/arm64
          # The digest was pushed by buildx's docker-container driver and never loaded into the
          # local daemon: read it straight from the registry.
          TRIVY_IMAGE_SRC: remote
          # Registry auth comes from the Docker config the "Log in to GHCR" step wrote, which is
          # scoped to ghcr.io. TRIVY_USERNAME/TRIVY_PASSWORD are deliberately not set: Trivy would
          # offer them to every registry it contacts, including its vulnerability-DB mirrors.
        with:
          # Pinned Trivy binary (trivy-action v0.36.0's default); never v0.69.4-v0.69.6 (Story 64.2).
          version: 'v0.70.0'
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  promote-aliases:
    name: Promote release aliases
    needs: [prepare, build-publish]
    if: needs.build-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable release sources
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for IMAGE in api migrate web; do
            docker buildx imagetools inspect "${IMAGE_NAMESPACE}/${IMAGE}:${VERSION}" >/dev/null
          done

      - name: Promote semantic-version aliases
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          MINOR="${VERSION%.*}"
          MAJOR="${VERSION%%.*}"

          for IMAGE in api migrate web; do
            SOURCE="${IMAGE_NAMESPACE}/${IMAGE}:${VERSION}"
            for ALIAS in "$MINOR" "$MAJOR" latest; do
              docker buildx imagetools create \
                --tag "${IMAGE_NAMESPACE}/${IMAGE}:${ALIAS}" \
                "$SOURCE"
            done
          done
