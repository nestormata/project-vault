# Local hot-reload overlay: bind-mounts apps/*/src into the containers and runs the API with
# `pnpm dev` instead of the built runner image, so edits take effect without a rebuild. It also
# sets VAULT_ALLOW_REMOTE_INIT=true (dev-only) so vault init needs no bootstrap token.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# NEVER layer this on a production deployment. See docs/development.md § "Compose overlays".
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: app-builder
    volumes:
      - ./apps/api/src:/app/apps/api/src
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # Dev-only convenience: skip the bootstrap-token requirement for vault init.
      # NEVER set this in production (docker-compose.prod.yml does not set it — defaults to false).
      VAULT_ALLOW_REMOTE_INIT: 'true'
    command: ["pnpm", "dev"]

  web:
    volumes:
      - ./apps/web/src:/app/apps/web/src
    environment:
      NODE_ENV: development
